function teamAvg(){const v=[];for(const m of S.matches)for(const s of Object.values(m.stats||{}))if(num(s.voto)>0)v.push(num(s.voto));return v.length?v.reduce((a,b)=>a+b,0)/v.length:null}
function votiPanel(p){
  const ms=S.matches.filter(isPlayed).sort((a,b)=>String(a.data).localeCompare(String(b.data))||num(a.numero)-num(b.numero));
  const pts=ms.map(m=>{const v=num(((m.stats||{})[p.id]||{}).voto),all=Object.values(m.stats||{}).map(s=>num(s.voto)).filter(x=>x>0);return {m,v:v>0?v:null,avg:all.length?all.reduce((a,b)=>a+b,0)/all.length:null}});
  if(!pts.some(x=>x.v!=null))return "";
  const vals=pts.flatMap(x=>[x.v,x.avg]).filter(x=>x!=null),lo=Math.max(0,Math.floor(Math.min(...vals))-1),hi=10;
  const W=Math.max(340,pts.length*70+50),H=220,pt=14,pb=40,pl=30,pr=14,ih=H-pt-pb,gw=(W-pl-pr)/pts.length;
  const X=i=>pl+gw*i+gw/2,Y=v=>pt+ih-((v-lo)/(hi-lo))*ih;
  let g="";for(let v=lo;v<=hi;v+=lo<=4?2:1)g+=`<line class="axis" x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}"${v>lo?' stroke-dasharray="2 4"':""}/><text x="${pl-8}" y="${Y(v)+4}" text-anchor="end">${v}</text>`;
  const path=k=>{let d="",pen=false;pts.forEach((x,i)=>{const v=x[k];if(v==null){pen=false;return}d+=(pen?"L":"M")+X(i).toFixed(1)+","+Y(v).toFixed(1);pen=true});return d};
  g+=`<path d="${path("avg")}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4"/><path d="${path("v")}" fill="none" stroke="var(--gf)" stroke-width="2"/>`;
  pts.forEach((x,i)=>{
    const tip=`${x.m.numero||"–"}ª vs ${x.m.avversario||"?"} · voto ${x.v!=null?String(x.v).replace(".",","):"–"} · media squadra ${x.avg!=null?fmtVoto(x.avg):"–"}`;
    g+=`<g data-tip="${esc(tip)}"><rect x="${X(i)-gw/2}" y="${pt}" width="${gw}" height="${ih+pb}" fill="transparent"/>${x.v!=null?`<circle cx="${X(i)}" cy="${Y(x.v)}" r="5" fill="var(--gf)" stroke="var(--surface)" stroke-width="2"/>`:""}<text x="${X(i)}" y="${H-pb+16}" text-anchor="middle" class="lbl">${esc(String(x.m.numero||"–"))}ª</text><text x="${X(i)}" y="${H-pb+31}" text-anchor="middle">${esc(shortName(x.m.avversario))}</text></g>`;
  });
  return `<div class="panel"><h3>Voti partita per partita</h3><div class="legend"><span><i style="background:var(--gf)"></i>${esc(String(p.nome).split(" ")[0])}</span><span><i style="background:var(--muted)"></i>Media della squadra</span></div><div class="chart-wrap"><svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="Voti di ${esc(p.nome)} partita per partita confrontati con la media della squadra">${g}</svg></div></div>`;
}

async function closeSeason(btn){
  const conf=(($("#ns-conf")||{}).value||"").trim().toUpperCase(),nuovo=(($("#ns-nome")||{}).value||"").trim();
  if(conf!=="CHIUDI"){toast("Per confermare scrivi CHIUDI nel riquadro");return}
  if(!nuovo){toast("Scrivi il nome della nuova stagione");return}
  const nome=stagioneNome(),id=(nome.replace(/[^0-9A-Za-z]+/g,"-")||"stagione")+"-"+Date.now().toString(36);
  btn.disabled=true;btn.textContent="Archivio in corso…";
  try{
    const ref=S.db.doc(col("archivio")+"/"+id),dati=archivioDati(nome);
    await ref.set(dati);
    const chk=await ref.get();
    if(!chk.exists||((chk.data().giornate||[]).length!==dati.giornate.length))throw new Error("archivio non verificato");
    const t=today(),del=[];
    for(const m of S.matches)del.push(col("giornate")+"/"+m.id);
    for(const k of Object.keys(S.quote))del.push(col("quote")+"/"+k);
    for(const x of S.cassa||[])del.push(col("cassa")+"/"+x.id);
    for(const x of S.classifica||[])del.push(col("classifica")+"/"+x.id);
    for(const x of S.multe||[])del.push(col("multe")+"/"+x.id);
    for(const x of S.campgioc||[])del.push(col("campgioc")+"/"+x.id);
    for(const k of Object.keys(S.visite||{}))del.push(col("visite")+"/"+k);
    for(const e of S.events||[])if(e.data&&e.data<t)del.push(col("eventi")+"/"+e.id);
    for(const a of S.allen||[])if(a.data&&a.data<t)del.push(col("allenamenti")+"/"+a.id);
    if((S.imp||{}).visite)del.push(col("impostazioni")+"/visite");
    let i=0;for(const p of del){await S.db.doc(p).delete();i++;if(i%5===0)btn.textContent=`Pulizia ${i}/${del.length}…`}
    if(isC5())for(const p of S.players)if(tessPaid(p))await S.db.doc(col("giocatori")+"/"+p.id).update({tess:{pagato:false,data:null}}); /* nuovo torneo: tesseramento da rifare */
    await S.db.doc(col("impostazioni")+"/stagione").set({nome:nuovo});
    S.closeOpen=false;toast(`Stagione ${nome} archiviata. Benvenuta stagione ${nuovo}! Ricordati di premere Pubblica per i giocatori`);render();
  }catch(e){console.error(e);btn.disabled=false;btn.textContent="Chiudi la stagione e ricomincia";toast("Chiusura non riuscita: i dati sono ancora al loro posto. Riprova.")}
}
async function archivioExcel(btn,id){

const traGiorni=iso=>{const d=daysTo(iso);return d===0?"oggi":d===1?"domani":d>1?"tra "+d+" giorni":""};
/* stessa squadra anche se scritta in modo diverso (es. "FULGOR" e "V.G. FULGOR", "POPOLO FC" e "FC POPOLO") */
const TOK_SKIP=new Set(["fc","asd","ssd","calcio","team","club","football"]);
const toks=s=>String(s||"").toLowerCase().replace(/[^a-z0-9àèéìòù]+/g," ").split(" ").filter(w=>w.length>=3&&!TOK_SKIP.has(w));
function sameTeam(a,b){const A=toks(a),B=toks(b);if(!A.length||!B.length)return nnTeam(a)===nnTeam(b);return A.filter(w=>B.includes(w)).length/Math.min(A.length,B.length)>=0.5}

const ROLE_SHORT=sl=>sl.k==="0"?"P":sl.label.startsWith("Difesa")?"D":sl.label.startsWith("Attacco")?"A":"C";
const ARROW_DEFS=`<defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0L10,5L0,10z" class="ah"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0L10,5L0,10z" class="ahb"/></marker></defs>`;
function libStart(t){const out={};for(const sl of slotsOf(t.modulo))out["s"+sl.k]={x:sl.x,y:sl.y,sl};return out}
function libPos(t,key,k,st){let p=key==="ball"?null:(st[key]?{x:st[key].x,y:st[key].y}:null);for(let i=0;i<k&&i<(t.steps||[]).length;i++){const q=((t.steps[i]||{}).pos||{})[key];if(q)p=q}return p}
function libArrows(t,k,st){
  let l="";
  if(k>=1)for(const key of [...Object.keys(st),"ball"]){
    const a=libPos(t,key,k-1,st),b=libPos(t,key,k,st);if(!b||!((t.steps[k-1]||{}).pos||{})[key])continue;
    const s=a||b,x1=s.x*3,y1=s.y*4,x2=b.x*3,y2=b.y*4,dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy);if(L<6)continue;
    const sh=key==="ball"?8:18,ex=x2-dx/L*sh,ey=y2-dy/L*sh;
    l+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" class="${key==="ball"?"ar-ball":"ar"}" marker-end="url(#${key==="ball"?"ahb":"ah"})"/>`;
  }
  return `<svg class="tarrows" viewBox="0 0 300 400" aria-hidden="true">${ARROW_DEFS}${l}</svg>`;
}
/* se la giornata scelta ha lo stesso modulo, nell'anteprima si vedono i giocatori veri */
function libPitch(t,k,m){
  const st=libStart(t),posti=m&&effMod(m)===t.modulo&&tacPlayers(m).length?resolvePosti(m):null;
  let h=`<div class="pitch tpitch" id="tl-pitch" role="img" aria-label="Tattica ${esc(t.nome)}">${PITCH_LINES}${libArrows(t,k,st)}`;
  for(const key of Object.keys(st)){
    const q=libPos(t,key,k,st);if(!q)continue;const sl=st[key].sl,p=posti&&playerById(posti[sl.k]);
    h+=`<div class="tok" data-lp="${key}" style="left:${q.x}%;top:${q.y}%"><span class="disc${sl.k==="0"?" gk":""}">${p?esc(p.numero||"–"):ROLE_SHORT(sl)}</span><span class="nm">${p?esc(cognome(p.nome)):esc(sl.label)}</span></div>`;
  }
  if((t.steps||[]).some(s=>(s.pos||{}).ball)){const q=libPos(t,"ball",k,st);h+=`<div class="tok ball" data-lp="ball"${q?"":" hidden"} style="left:${q?q.x:50}%;top:${q?q.y:50}%"><span class="bdisc"></span></div>`}
  return h+`</div>`;
}

/* ---------- ALLENAMENTI: dati e presenze ---------- */
/* ogni allenamento: {data, ora, luogo, note, pres:{idGiocatore:"p"|"a"|"g"}}  p=presente a=assente g=giustificato ("" = da segnare) */
const AL_V=[["p","Presente"],["a","Assente"],["g","Giustificato"]];
const alSorted=()=>[...(S.allen||[])].sort((a,b)=>String(a.data).localeCompare(String(b.data))||String(a.ora||"").localeCompare(String(b.ora||"")));
const alPast=()=>alSorted().filter(a=>a.data&&a.data<=todayISO());
const alNext=()=>alSorted().filter(a=>a.data&&a.data>=todayISO());
const alMarked=a=>Object.values(a.pres||{}).some(v=>v);
function alStats(pid,last){
  let L=alPast().filter(a=>(a.pres||{})[pid]);
  if(last)L=L.slice(-last);
  const r={p:0,a:0,g:0,tot:L.length};
  for(const a of L)r[a.pres[pid]]=(r[a.pres[pid]]||0)+1;
  r.pct=r.tot?r.p/r.tot:null;

/* ---------- FORMAZIONE CONSIGLIATA ---------- */
const roleFor=sl=>sl.k==="0"?"Portiere":sl.label.startsWith("Difesa")?"Difensore":sl.label.startsWith("Attacco")?"Attaccante":"Centrocampista";
const defBench=()=>S.campo==="a5"?5:7;
function minFinora(pid,exceptId){let min=0,pres=0,gol=0,ass=0;const v=[];for(const m of S.matches){if(m.id===exceptId)continue;const s=(m.stats||{})[pid];if(!s)continue;const x=num(s.minuti);min+=x;if(x>0)pres++;gol+=num(s.gol);ass+=num(s.assist);if(num(s.voto)>0)v.push(num(s.voto))}return {min,pres,gol,ass,media:v.length?v.reduce((a,b)=>a+b,0)/v.length:null}}
function suggScores(d,crit){
  const base=S.players.filter(p=>(p.stato||"Disponibile")==="Disponibile").map(p=>({p,f:minFinora(p.id,d.id),al:alStats(p.id,6)}));
  const maxMin=Math.max(1,...base.map(x=>x.f.min)),avg=teamAvg()||6;
  for(const x of base){
    const att=x.al.tot?(x.al.p+0.5*x.al.g)/x.al.tot:0.6; /* senza allenamenti segnati conta come “nella media” */
    const alTxt=x.al.tot?` · allenamenti ${x.al.p}/${x.al.tot}`:"";
    if(crit==="forma"){
      const voto=(x.f.media??avg)/10,prod=Math.min(1,(x.f.gol+x.f.ass)/Math.max(1,x.f.pres));
      x.score=voto*1.0+prod*0.25+att*0.35;
      x.why=(x.f.media!=null?`media voto ${fmtVoto(x.f.media)}`:"ancora senza voti")+(x.f.gol?` · ${x.f.gol} gol`:"")+(x.f.ass?` · ${x.f.ass} assist`:"")+alTxt;
    }else{
      x.score=(1-x.f.min/maxMin)*1.0+att*0.35;
      x.why=(x.f.min?`${x.f.min}' giocati finora`:"non ha ancora giocato")+alTxt;
    }
  }
  return base.sort((a,b)=>b.score-a.score||num(a.p.numero)-num(b.p.numero));
}
function suggestLineup(d,crit,benchN){
  const slots=slotsOf(d.modulo),cand=suggScores(d,crit),used=new Set(),posti={},out={tit:[],pan:[],fuori:[],warn:[]};
  for(const p of S.players){const st=p.stato||"Disponibile";if(st!=="Disponibile")out.fuori.push({p,why:st})}
  const take=pred=>{const c=cand.find(c=>!used.has(c.p.id)&&pred(c.p));if(c)used.add(c.p.id);return c};
  const gk=slots[0];let g=take(p=>p.ruolo==="Portiere");
  if(!g){g=take(p=>true);if(g)out.warn.push("Nessun portiere disponibile: in porta va un giocatore di movimento.")}
  if(g){posti[gk.k]=g.p.id;out.tit.push({...g,sl:gk})}
  const field=slots.slice(1);
  for(const sl of field){const c=take(p=>p.ruolo===roleFor(sl));if(c){posti[sl.k]=c.p.id;out.tit.push({...c,sl})}}
  const near={Difensore:["Centrocampista","Attaccante"],Centrocampista:["Difensore","Attaccante"],Attaccante:["Centrocampista","Difensore"]};
  for(const sl of field){if(posti[sl.k])continue;let c=null;for(const r of near[roleFor(sl)]){c=take(p=>p.ruolo===r);if(c)break}if(!c)c=take(p=>p.ruolo!=="Portiere")||take(()=>true);if(c){posti[sl.k]=c.p.id;out.tit.push({...c,sl,adatt:true})}}
  if(Object.keys(posti).length<slots.length)out.warn.push(`Ci sono solo ${cand.length} giocatori disponibili: ne servono ${slots.length} per partire.`);
  if(out.tit.some(x=>x.adatt))out.warn.push("Qualcuno gioca fuori ruolo perché non ci sono abbastanza giocatori di quel ruolo disponibili.");
  const rest=cand.filter(c=>!used.has(c.p.id)),gk2=rest.find(c=>c.p.ruolo==="Portiere"),order=gk2?[gk2,...rest.filter(c=>c!==gk2)]:rest;
  out.pan=order.slice(0,benchN);
  out.fuori.push(...order.slice(benchN).map(c=>({...c,why:crit==="turno"&&c.f.min>0?"Turno di riposo: ha giocato di più":"Panchina piena: aumenta i posti in panchina per convocarlo"})));
  if(!cand.some(c=>c.f.min>0||c.al.tot||c.f.media!=null))out.warn.unshift("Non ci sono ancora minuti giocati, voti o presenze agli allenamenti: per ora la proposta segue solo i ruoli. Diventa più precisa con le prime partite.");
  out.tit.sort((a,b)=>slots.indexOf(a.sl)-slots.indexOf(b.sl));
  out.posti=posti;
  return out;
}
function suggPanel(d){
  if(isPlayed(d))return "";
  const crit=S.suggCrit==="forma"?"forma":"turno",bn=S.suggBench??defBench(),sg=S.sugg&&S.sugg.mid===(d.id||"nuova")?S.sugg:null;
  let h=`<div class="panel sugg"><div><h3>Formazione consigliata</h3><div class="muted small">L'app sceglie titolari e panchina tra i giocatori <b>disponibili</b> in Rosa, rispettando il modulo e i ruoli. Guarda i minuti giocati finora e le presenze agli allenamenti. Poi puoi cambiare tutto a mano.</div></div>
    <div class="row"><div class="tsteps" role="group" aria-label="Come scegliere">${[["turno","Far giocare tutti"],["forma","I più in forma"]].map(([k,l])=>`<button class="chip" data-suggcrit="${k}" aria-pressed="${crit===k}">${l}</button>`).join("")}</div>
    <label class="row small">In panchina <select id="sg-bench" aria-label="Quanti in panchina">${[2,3,4,5,6,7,8,9,10,12].map(n=>`<option value="${n}" ${n===bn?"selected":""}>${n}</option>`).join("")}</select></label>
    <button class="btn primary" data-sugg>${sg?"Rifai la proposta":"Proponi la formazione"}</button></div>
    <div class="muted small">${crit==="turno"?"<b>Far giocare tutti:</b> parte titolare chi finora ha giocato meno minuti, così tutti trovano spazio.":"<b>I più in forma:</b> parte titolare chi ha la media voto più alta e fa più gol e assist."}</div>`;
  if(sg){
    const r=sg.res,tmp={modulo:d.modulo,posti:r.posti,stats:Object.fromEntries([...r.tit.map(x=>[x.p.id,{ruolo:"titolare"}]),...r.pan.map(x=>[x.p.id,{ruolo:"panchina"}])]),capitano:d.capitano,vice:d.vice};
    const li=(x,lab)=>`<li><b>${esc(x.p.nome)}</b>${lab?` <span class="pill s-mute">${esc(lab)}</span>`:""}${x.adatt?' <span class="pill s-warn">Fuori ruolo</span>':""}<div class="muted small">${esc(x.why||"")}</div></li>`;
    h+=r.warn.map(w=>`<div class="small" style="color:var(--warn)">${esc(w)}</div>`).join("");
    h+=`<div class="field-wrap">${pitchHTML(tmp)}<div class="side">
      <div><b>Titolari</b><ul class="sg-list">${r.tit.map(x=>li(x,x.sl.label)).join("")}</ul></div>
      ${r.pan.length?`<div><b>Panchina</b><ul class="sg-list">${r.pan.map(x=>li(x)).join("")}</ul></div>`:""}
      ${r.fuori.length?`<div><b>Non convocati</b><ul class="sg-list">${r.fuori.map(x=>li(x)).join("")}</ul></div>`:""}
    </div></div>
    <div class="row"><button class="btn go" data-suggapply>Usa questa formazione</button><button class="btn" data-suggclose>Chiudi</button><span class="muted small">Gli obiettivi personali già scritti restano.</span></div>`;
  }
  return h+`</div>`;
}
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t||!S.admin||!S.editing)return;const ds=t.dataset,d=S.editing;
  if(ds.suggcrit){S.suggCrit=ds.suggcrit;if(S.sugg)S.sugg={mid:d.id||"nuova",res:suggestLineup(d,S.suggCrit,S.suggBench??defBench())};rerenderEditor();return}
  if("sugg" in ds){S.sugg={mid:d.id||"nuova",res:suggestLineup(d,S.suggCrit==="forma"?"forma":"turno",S.suggBench??defBench())};rerenderEditor();return}
  if("suggclose" in ds){S.sugg=null;rerenderEditor();return}
  if("suggapply" in ds&&S.sugg){
    const r=S.sugg.res;d.stats=d.stats||{};
    for(const p of S.players){d.stats[p.id]=d.stats[p.id]||{};d.stats[p.id].ruolo=""}
    for(const x of r.tit)d.stats[x.p.id].ruolo="titolare";
    for(const x of r.pan)d.stats[x.p.id].ruolo="panchina";
    d.posti={...r.posti};
    if(d.capitano&&!lineupOf(d,d.capitano))d.capitano="";
    if(d.vice&&!lineupOf(d,d.vice))d.vice="";
    S.sugg=null;rerenderEditor();toast("Formazione inserita: controllala e premi Salva giornata");return}
});
document.addEventListener("change",e=>{if(e.target.id==="sg-bench"&&S.editing){S.suggBench=num(e.target.value);if(S.sugg)S.sugg={mid:S.editing.id||"nuova",res:suggestLineup(S.editing,S.suggCrit==="forma"?"forma":"turno",S.suggBench)};rerenderEditor()}});

/* ---------- TESTO PRONTO PER I POST INSTAGRAM ---------- */
const DEF_TAG={c8:"@amacup.calcio @amacup.casale\n#geminafc #amacup #calcioa8",a5:"@amacup.casale\n#papiciulos #amacup #calcioa5"};
const igTag=()=>{const t=((S.imp||{}).instagram||{}).tag;return t!=null?t:DEF_TAG[S.campo]||""};
const capEnd=()=>{const c=CAMPI[S.campo],t=igTag();return `\n\n${c.forza} ${c.cuori}${t?"\n\n"+t:""}`};
const MEDAL=r=>r===1?"🥇":r===2?"🥈":r===3?"🥉":r+"°";
const nomeP=p=>titleCase(p.nome);
function capMatch(m,v){
  const c=CAMPI[S.campo],noi=c.nome.toUpperCase(),opp=String(m.avversario||"?").toUpperCase(),gg=m.numero?` · ${m.numero}ª giornata`:"";
  const quando=[m.data?`📅 ${cap1(fmtLong(m.data))}${m.orario?" · ⏰ ore "+m.orario:""}`:"",m.luogo?`📍 ${m.luogo}`:""].filter(Boolean);
  const L=[];
  if(v==="formazione"){
    const slots=slotsOf(m.modulo),posti=resolvePosti(m),nm=pid=>{const p=playerById(pid);return p?nomeP(p)+(m.capitano===pid?" (C)":""):""};
    const line=pre=>slots.filter(s=>s.k!=="0"&&s.label.startsWith(pre)).map(s=>nm(posti[s.k])).filter(Boolean).join(" · ");
    const pan=S.players.filter(p=>lineupOf(m,p.id)==="panchina").map(nomeP);
    L.push(`📋 LA FORMAZIONE${gg}`,`${noi} 🆚 ${opp}`,`Modulo ${effMod(m)}`,"");
    if(posti["0"])L.push(`🧤 ${nm(posti["0"])}`);
    const dif=line("Difesa"),att=line("Attacco"),cen=slots.filter(s=>s.k!=="0"&&!s.label.startsWith("Difesa")&&!s.label.startsWith("Attacco")).map(s=>nm(posti[s.k])).filter(Boolean).join(" · ");
    if(dif)L.push(`🛡️ ${dif}`);if(cen)L.push(`⚙️ ${cen}`);if(att)L.push(`🎯 ${att}`);
    if(pan.length)L.push("",`🔄 In panchina: ${pan.join(", ")}`);
    if(quando.length)L.push("",...quando);
  }else if(isPlayed(m)){
    const gf=num(m.gf),gs=num(m.gs),conv=S.players.filter(p=>(m.stats||{})[p.id]);
    const list=k=>conv.filter(p=>num(m.stats[p.id][k])>0).sort((a,b)=>num(m.stats[b.id][k])-num(m.stats[a.id][k])).map(p=>nomeP(p)+(num(m.stats[p.id][k])>1?` (${num(m.stats[p.id][k])})`:"")).join(", ");
    const mar=list("gol"),ass=list("assist"),mvp=m.mvp&&playerById(m.mvp);
    L.push(`🏁 RISULTATO FINALE${gg}`,`${noi} ${gf}–${gs} ${opp}`,"");
    L.push(gf>gs?(gf-gs>=3?"✅ Vittoria netta! Grande prestazione di tutto il gruppo 💪":"✅ Tre punti meritati, avanti così! 💪"):gf===gs?"🤝 Un punto che muove la classifica: si riparte dal prossimo allenamento.":"❌ Oggi è andata male. Testa alta: si lavora in settimana e si riparte più forti.");
    if(mar||ass||mvp)L.push("");
    if(mar)L.push(`⚽ Marcatori: ${mar}`);if(ass)L.push(`🅰️ Assist: ${ass}`);if(mvp)L.push(`⭐ MVP: ${nomeP(mvp)}`);
  }else{
    L.push(`⚽ MATCH DAY${gg}`,`${noi} 🆚 ${opp}`,"",...quando,m.casa==="trasferta"?"🚌 In trasferta":"🏟️ In casa","","Tutti al campo a sostenere i ragazzi! 📣");
  }
  return L.join("\n")+capEnd();
}
const UNIT={gol:["gol","gol"],ass:["assist","assist"],pres:["presenza","presenze"],gk:["porta inviolata","porte inviolate"],gks:["gol subito","gol subiti"],mvp:["premio MVP","premi MVP"]};
function capTop(cat){
  const def=TOP_CATS.find(c=>c[0]===cat)||TOP_CATS[0],rows=topRows(cat).slice(0,5);
  const val=r=>cat==="cart"?`${r.g?r.g+" 🟨":""}${r.g&&r.r?" ":""}${r.r?r.r+" 🟥":""}`:cat==="gks"?`${r.v} ${UNIT.gks[r.v===1?0:1]} in ${r.t} ${r.t===1?"partita":"partite"}`:`${r.v} ${(UNIT[cat]||["",""])[r.v===1?0:1]}`;
  return [`🏆 CLASSIFICA ${def[1].toUpperCase()}`,`Stagione ${stagioneNome()}`,"",...rows.map(r=>`${MEDAL(r.rank)} ${nomeP(r.p)} – ${val(r)}`),"",cat==="cart"?"Occhio ai cartellini, ragazzi! 😅":"Complimenti ragazzi! 👏"].join("\n")+capEnd();
}
function capCl(){
  const rows=clRows(),k=rows.findIndex(r=>r.noi),g=Math.max(0,...rows.map(r=>num(r.g)));
  const L=[`📊 CLASSIFICA DEL CAMPIONATO${g?` dopo ${g} ${g===1?"giornata":"giornate"}`:""}`,"",...rows.map((r,i)=>`${r.noi?"👉 ":""}${i+1}. ${r.squadra} – ${r.pt} pt`)];
  if(k>=0)L.push("",`${CAMPI[S.campo].nome} è ${k+1}° con ${rows[k].pt} ${rows[k].pt===1?"punto":"punti"}. Avanti così!`);
  return L.join("\n")+capEnd();
}
function capCg(){
  const rows=cgRows("gol").slice(0,5);let pr=null,rank=0;
  const L=["⚽ CAPOCANNONIERI DEL CAMPIONATO",`Stagione ${stagioneNome()}`,""];
  rows.forEach((r,i)=>{if(!pr||pr.n!==r.n)rank=i+1;pr=r;L.push(`${MEDAL(rank)} ${titleCase(r.nome)} (${r.squadra}) – ${r.n} gol${isNoiTeam(r.squadra)?" 💥":""}`)});
  const nostri=rows.filter(r=>isNoiTeam(r.squadra));
  if(nostri.length)L.push("",`Bravo ${nostri.map(r=>titleCase(r.nome).split(" ")[0]).join(" e ")}! 👏`);
  return L.join("\n")+capEnd();
}
function capPotm(e){
  const b=e.best;
  return [`⭐ GIOCATORE DEL MESE · ${cap1(monthLabel(e.k))}`,"",`${nomeP(b.p)}${b.p.numero?" #"+b.p.numero:""} 🔥`,"",`📈 Media voto: ${fmtVoto(b.media)}`,`⚽ Gol: ${b.gol}`,`🅰️ Assist: ${b.ass}`,`🏟️ Partite: ${b.pres}`,"","Complimenti, te lo sei meritato! 👏"].join("\n")+capEnd();
}
/* riquadro con il testo, dentro il pannello della grafica */
function igCapBox(o){
  if(!o.cap)return "";
  if(S.igFmt==="story")return `<div class="muted small">Le storie di Instagram non hanno testo sotto: se pubblichi come <b>post</b>, qui trovi anche il testo già pronto da copiare.</div>`;
  const ck=o.key.split("|").filter(x=>x!=="post"&&x!=="story").join("|"),ed=S.igCapEdit&&S.igCapEdit.key===ck;
  const txt=ed?S.igCapEdit.txt:o.cap();
  return `<div class="ig-cap"><div><b>Testo del post</b><div class="muted small">Copialo e incollalo su Instagram quando pubblichi la foto. Puoi correggerlo qui prima di copiarlo.</div></div>
    <textarea id="ig-cap" class="riep" rows="10" data-capkey="${esc(ck)}" aria-label="Testo del post Instagram">${esc(txt)}</textarea>
    <div class="row"><button class="btn go" data-igcapcopy>Copia testo</button>${ed?`<button class="btn sm" data-igcapreset>Rifai il testo</button>`:""}<button class="btn sm" data-igtag>${S.igTagOpen?"Chiudi":"Tag e hashtag"}</button></div>
    ${S.igTagOpen?`<form id="igTagForm" class="panel"><label class="f">Tag e hashtag messi in fondo a ogni post<textarea id="ig-tag" rows="3">${esc(igTag())}</textarea></label><div class="row"><button class="btn sm primary" type="submit">Salva</button></div></form>`:""}</div>`;
}
document.addEventListener("input",e=>{if(e.target.id==="ig-cap")S.igCapEdit={key:e.target.dataset.capkey,txt:e.target.value}});
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t||!S.admin)return;const ds=t.dataset;
  if("igcapcopy" in ds){const el=$("#ig-cap");if(el)copyText(el.value,"Testo copiato: incollalo su Instagram");return}
  if("igcapreset" in ds){S.igCapEdit=null;render();return}
  if("igtag" in ds){S.igTagOpen=!S.igTagOpen;render();return}
});
document.addEventListener("submit",e=>{
  if(e.target.id!=="igTagForm")return;e.preventDefault();if(!S.admin)return;
  const tag=(($("#ig-tag")||{}).value||"").trim();S.igTagOpen=false;
  safe(S.db.doc(col("impostazioni")+"/instagram").set({tag}),"Tag e hashtag salvati");
});

</script>
