  }
  const pending=new Set();let flushT=null;
  function emit(coll){pending.add(coll);if(flushT)return;flushT=setTimeout(()=>{flushT=null;const list=[...pending];pending.clear();
    for(const c of list){const ls=listeners.get(c);if(!ls)continue;const snap=makeSnap(c);for(const l of [...ls]){try{l.next(snap)}catch(e){console.error(e)}}}},0)}
  async function fetchColl(coll){
    if(loading.has(coll))return loading.get(coll);
    const p=(async()=>{
      const m=new Map();let from=0;
      for(;;){const {data,error}=await sb.from("docs").select("id,data").eq("coll",coll).range(from,from+999);
        if(error)throw error;for(const r of data)m.set(r.id,r.data||{});if(data.length<1000)break;from+=1000}
      cache.set(coll,m);loaded.add(coll);return m;
    })();
    loading.set(coll,p);try{return await p}finally{loading.delete(coll)}
  }
  async function readDoc(coll,id){
    if(loaded.has(coll)){const d=cache.get(coll).get(id);return d===undefined?null:d}
    const {data,error}=await sb.from("docs").select("data").eq("coll",coll).eq("id",id).maybeSingle();
    if(error)throw error;return data?data.data:null;
  }
  async function writeDoc(coll,id,data){
    const before=loaded.has(coll)?cache.get(coll).get(id):undefined;
    if(loaded.has(coll)){cache.get(coll).set(id,clone(data));emit(coll)}
    const {error}=await sb.from("docs").upsert({coll,id,data,updated_at:new Date().toISOString()});
    if(error){if(loaded.has(coll)){if(before===undefined)cache.get(coll).delete(id);else cache.get(coll).set(id,before);emit(coll)}throw error}
  }
  function docRef(path){
    const [coll,id]=split(path);
    return {id,path,
      async get(){const d=await readDoc(coll,id);return {id,exists:d!=null,data:()=>d==null?undefined:clone(d),metadata:{fromCache:false,hasPendingWrites:false}}},
      async set(data){await writeDoc(coll,id,clone(data))},
      async update(data){const cur=await readDoc(coll,id);await writeDoc(coll,id,deepMerge(cur||{},data))},
      async delete(){if(loaded.has(coll)){cache.get(coll).delete(id);emit(coll)}const {error}=await sb.from("docs").delete().eq("coll",coll).eq("id",id);if(error)throw error},
      onSnapshot(next,err){const c=collRef(coll);return c.onSnapshot(s=>{const d=s.docs.find(x=>x.id===id);next(d||{id,exists:false,data:()=>undefined,metadata:{fromCache:false,hasPendingWrites:false}})},err)},
      collection(sub){return collRef(path+"/"+sub)}};
  }
  function collRef(coll){
    return {path:coll,
      doc(id){return docRef(coll+"/"+(id||newId()))},
      async add(data){const r=docRef(coll+"/"+newId());await r.set(data);return r},
      async get(){await fetchColl(coll);return makeSnap(coll)},
      where(){return this},orderBy(){return this},limit(){return this},
      onSnapshot(next,err){
        const l={next,err};if(!listeners.has(coll))listeners.set(coll,new Set());listeners.get(coll).add(l);
        (loaded.has(coll)?Promise.resolve():fetchColl(coll)).then(()=>emit(coll)).catch(e=>{console.error(e);if(err)err({code:"unavailable",message:String(e&&e.message||e)})});
        return ()=>{const s=listeners.get(coll);if(s)s.delete(l)};
      }};
  }
  const db={doc:docRef,collection:collRef};

  /* aggiornamenti in tempo reale + ricarica quando torni sull'app */
  let rt=false;
  function startRealtime(){
    if(rt)return;rt=true;
    try{sb.channel("gemina-docs").on("postgres_changes",{event:"*",schema:"public",table:"docs"},p=>{
      const row=p.eventType==="DELETE"?p.old:p.new;if(!row||!row.coll||!loaded.has(row.coll))return;
      if(p.eventType==="DELETE")cache.get(row.coll).delete(row.id);else cache.get(row.coll).set(row.id,row.data||{});
      emit(row.coll);
    }).subscribe()}catch(e){console.error(e)}
    document.addEventListener("visibilitychange",()=>{if(document.visibilityState!=="visible")return;
      for(const c of [...loaded])fetchColl(c).then(()=>emit(c)).catch(()=>{})});
  }

  let session=null,adminP=null;
  async function isAdmin(){
    if(!sb)return false;
    if(adminP)return adminP;
    adminP=(async()=>{
      const {data}=await sb.auth.getSession();session=data&&data.session;
      if(!session)return false;
      const {data:row,error}=await sb.from("admins").select("user_id").eq("user_id",session.user.id).maybeSingle();
      return !error&&!!row;
    })();
    return adminP;
  }

  const SB=window.SB={
    client:sb,
    async loadSnap(){
      if(!sb)return null;
      try{const {data,error}=await sb.from("pubblico").select("data").eq("id","snap").maybeSingle();if(error)throw error;return data?data.data:null}
      catch(e){console.error(e);return null}
    },
    async saveSnap(snap){
      const {error}=await sb.from("pubblico").upsert({id:"snap",data:snap,updated_at:new Date().toISOString()});
      if(error)throw error;
    },
    async signIn(email,pw){
      const {data,error}=await sb.auth.signInWithPassword({email:String(email).trim(),password:pw});
      if(error)throw error;adminP=null;return data;
    },
    async signOut(){try{await sb.auth.signOut()}catch(e){}adminP=null},
    loginFormHtml(){
      return `<form class="login" id="sbForm" autocomplete="on">
        <img class="crest big-crest" src="${document.getElementById("crest").src}" alt="Stemma">
        <h2>Accesso dirigenza</h2>
        <p class="muted small">Entra con la email e la password della dirigenza che hai creato su Supabase.</p>
        <label class="f">Email<input type="email" id="sb-email" required autocapitalize="none" spellcheck="false" autocomplete="username"></label>
        <label class="f">Password<input type="password" id="sb-pw" required autocomplete="current-password"></label>
        <div class="lg-err" id="sb-err" hidden></div>
        <button class="btn go" type="submit" id="sb-btn">Entra come dirigenza</button>
        <button class="btn sm" type="button" data-sbback>← Torna all'accesso giocatori</button>
      </form>`;
    }
  };


  /* importazione dei dati della vecchia app (una volta sola, quando il database è vuoto) */
  SB.offerImport=async function(){
    try{
      const {count,error}=await sb.from("docs").select("id",{count:"exact",head:true});
      if(error||count>0)return;
    }catch(e){return}
    const box=document.createElement("div");
    box.id="sbImport";
    box.style.cssText="position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:9999;background:#24104a;color:#f3eeff;border:2px solid #b4f000;border-radius:12px;padding:14px;font:15px/1.4 system-ui,sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.35)";
    box.innerHTML=`<b style="color:#b4f000">Il database è vuoto.</b><br>Vuoi caricare i dati della vecchia app? Scegli il file <b>dati-vecchia-app.json</b>.
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
        <label style="background:#b4f000;color:#18120f;font-weight:700;padding:9px 14px;border-radius:8px;cursor:pointer">Scegli il file<input type="file" accept=".json,application/json" id="sbImpFile" hidden></label>
        <button type="button" id="sbImpNo" style="background:transparent;color:#f3eeff;border:1px solid #b9a8de;padding:9px 14px;border-radius:8px">Non ora</button>
      </div><div id="sbImpMsg" style="margin-top:8px"></div>`;
    document.body.appendChild(box);
    box.querySelector("#sbImpNo").onclick=()=>box.remove();
    box.querySelector("#sbImpFile").onchange=async ev=>{
      const f=ev.target.files[0];if(!f)return;
      const msg=box.querySelector("#sbImpMsg");
      try{
        const j=JSON.parse(await f.text());
        if(j.tipo!=="gemina-migrazione"||!Array.isArray(j.docs))throw new Error("file");
        const now=new Date().toISOString();let batch=[],size=0,done=0;
        const flush=async()=>{if(!batch.length)return;const {error}=await sb.from("docs").upsert(batch);if(error)throw error;done+=batch.length;batch=[];size=0;msg.textContent=`Caricati ${done} di ${j.docs.length}…`};
        for(const d of j.docs){const row={coll:d.coll,id:d.id,data:d.data,updated_at:now};const n=JSON.stringify(row).length;if(size+n>400000)await flush();batch.push(row);size+=n}
        await flush();
        if(j.snap)await SB.saveSnap(j.snap);
        msg.textContent="Fatto! Ricarico l'app…";setTimeout(()=>location.reload(),1200);
      }catch(e){console.error(e);msg.textContent=e&&e.message==="file"?"Questo non è il file giusto: scegli dati-vecchia-app.json.":"Qualcosa è andato storto, riprova."}
    };
  };

  document.addEventListener("click",e=>{
    if(e.target.closest("[data-sblogin]")){S.sbForm=true;document.getElementById("main").innerHTML=viewLogin();return}
    if(e.target.closest("[data-sbback]")){S.sbForm=false;document.getElementById("main").innerHTML=viewLogin();return}
  });
  document.addEventListener("submit",async e=>{
    if(e.target.id!=="sbForm")return;e.preventDefault();
    const er=document.getElementById("sb-err"),btn=document.getElementById("sb-btn");
    btn.disabled=true;btn.textContent="Controllo…";er.hidden=true;
    try{
      await SB.signIn(document.getElementById("sb-email").value,document.getElementById("sb-pw").value);
      if(!(await isAdmin())){await SB.signOut();throw new Error("noadmin")}
      location.reload();
    }catch(x){
      er.textContent=x&&x.message==="noadmin"?"Questo account non è della dirigenza. Controlla il passaggio 2-dirigenza.sql.":"Email o password non corretti.";
      er.hidden=false;btn.disabled=false;btn.textContent="Entra come dirigenza";
    }
  });

  /* scaricare file (Excel, immagini) dal telefono o dal computer */
  const downloads={async save({filename,data}){
    const blob=data instanceof Blob?data:new Blob([data]);
    const url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;a.download=filename||"file";document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
  }};

  window.claude={async use(name){
    if(!sb)return null;
    if(name==="user")return {canEdit:isAdmin,isOwner:isAdmin,async id(){await isAdmin();return session?session.user.id:null},can:async()=>isAdmin()};
    if(name==="db"){const a=await isAdmin();if(a)startRealtime();return a?db:null}
    if(name==="downloads")return downloads;
    return null;
  }};
})();

</script>

<title>Gemina FC Spogliatoio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: banda viola in alto con stemma e schede, poi un'unica colonna di lavoro larga max 1080px */
:root{
  --bg:#f5f3f9; --surface:#ffffff; --surface-2:#efebf6; --ink:#1c1430; --muted:#675e7c; --line:#e1dbec;
  --viola:#4a1d8c; --viola-soft:#ece4fa; --acido:#b4f000; --acido-ink:#18120f;
  --band:#24104a; --band-ink:#f3eeff; --band-muted:#b9a8de;
  --ok:#17824a; --ok-soft:#dcf3e6; --warn:#a86b00; --warn-soft:#fbefd5; --bad:#c42f2f; --bad-soft:#fbe1e1;
  --yellow-card:#f2c200; --red-card:#d62828;
  --f-display:"Saira Condensed","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px; --on-sem:#ffffff;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#110b1b; --surface:#1b1429; --surface-2:#241b36; --ink:#eee8f9; --muted:#a69cbd; --line:#30264a;
  --viola:#9b70ff; --viola-soft:#2c1f4a; --acido:#c4ff1f; --acido-ink:#140f1c;
  --band:#1a0b36; --band-ink:#f3eeff; --band-muted:#a796cf;
  --ok:#4fd18c; --on-sem:#140f1c; --ok-soft:#173527; --warn:#f0b543; --warn-soft:#3a2c12; --bad:#ff7070; --bad-soft:#3d1a1d;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#110b1b; --surface:#1b1429; --surface-2:#241b36; --ink:#eee8f9; --muted:#a69cbd; --line:#30264a;
  --viola:#9b70ff; --viola-soft:#2c1f4a; --acido:#c4ff1f; --acido-ink:#140f1c;
  --band:#1a0b36; --band-ink:#f3eeff; --band-muted:#a796cf;
  --ok:#4fd18c; --on-sem:#140f1c; --ok-soft:#173527; --warn:#f0b543; --warn-soft:#3a2c12; --bad:#ff7070; --bad-soft:#3d1a1d;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.num,table td.n,table th.n{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acido);outline-offset:2px}

/* testata */
.band{background:var(--band);color:var(--band-ink);padding-inline:16px}
.band-in{max-width:1080px;margin:0 auto;padding-block:18px 0;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.crest{width:auto;height:52px;flex:none;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:.02em;line-height:1;margin:0;text-transform:uppercase}
.brand h1 b{color:var(--acido);font-weight:800}
.brand .who{margin-left:auto;font-size:13px;color:var(--band-muted);display:flex;align-items:center;gap:8px}
.role-pill{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--acido);color:var(--acido-ink)}
.role-pill.pl{background:transparent;color:var(--band-ink);border:1px solid var(--band-muted)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:0;color:var(--band-muted);padding:10px 14px 12px;font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--band-ink);border-bottom-color:var(--acido)}
.tabs button:hover{color:var(--band-ink)}

main{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:22px 60px;display:flex;flex-direction:column;gap:20px}
h2{font-family:var(--f-display);font-weight:800;font-size:24px;text-transform:uppercase;letter-spacing:.03em;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.05em;margin:0;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:center}
.empty strong{color:var(--ink);font-family:var(--f-display);font-size:19px;text-transform:uppercase;letter-spacing:.04em}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--viola)}
.btn.primary{background:var(--viola);border-color:var(--viola);color:#fff}
.btn.go{background:var(--acido);border-color:var(--acido);color:var(--acido-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}

label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);min-width:0}
input[type=text],input[type=number],input[type=date],input[type=month],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:15px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink);min-width:0;width:100%}
input:focus,select:focus{border-color:var(--viola);outline:none}
.grid-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}

/* tabelle */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:12.5px;color:var(--muted);text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:0}
th.n,td.n{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--viola-soft)}
td input[type=number]{width:62px;padding:5px 6px;text-align:right}
td input[type=text]{min-width:160px;padding:5px 8px}
.shirt{display:inline-grid;place-items:center;min-width:30px;height:26px;padding:0 6px;border-radius:6px;background:var(--viola-soft);color:var(--viola);font-family:var(--f-display);font-weight:800;font-size:15px}
.card-y,.card-r{display:inline-block;width:10px;height:14px;border-radius:2px;vertical-align:-2px;margin-right:4px}
.card-y{background:var(--yellow-card)} .card-r{background:var(--red-card)}
.mvp{font-family:var(--f-display);font-weight:800;font-size:11px;letter-spacing:.08em;background:var(--acido);color:var(--acido-ink);padding:2px 6px;border-radius:4px}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-ok{background:var(--ok-soft);color:var(--ok)}
.s-warn{background:var(--warn-soft);color:var(--warn)}
.p-purple{background:rgba(124,58,237,.14);color:#6d28d9}.p-green{background:rgba(22,163,74,.14);color:#15803d}.p-orange{background:rgba(234,88,12,.15);color:#c2410c}
.s-bad{background:var(--bad-soft);color:var(--bad)}
.s-mute{background:var(--surface-2);color:var(--muted)}
select.state{width:auto;padding:4px 8px;font-size:13px}

/* scheda giocatore */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:var(--band);color:var(--band-ink);border-radius:var(--r);padding:20px}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:68px;line-height:.85;color:var(--acido);min-width:64px;text-align:center}
.hero h2{font-size:30px}
.hero .meta{color:var(--band-muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile .v{font-family:var(--f-display);font-weight:800;font-size:32px;line-height:1}
.tile .k{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.tile.hl{border-color:var(--viola);background:var(--viola-soft)}
.goal{border-left:4px solid var(--acido);background:var(--surface);border-radius:0 var(--r) var(--r) 0;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.goal .t{font-size:17px;font-weight:600}

/* giornate */
.matches{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.match{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left}
.match:hover{border-color:var(--viola)}
.match .md{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--viola)}
.match .vs{font-size:17px;font-weight:600}
.match .score{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1}

/* editor giornata: passi e formazione */
.steps{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.steps button{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;font-weight:700}
.steps button span{grid-row:span 2;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-family:var(--f-display);font-size:17px}
.steps button small{font-weight:500;color:var(--muted);font-size:12.5px}
.steps button[aria-selected="true"]{border-color:var(--viola);background:var(--viola-soft)}
.steps button[aria-selected="true"] span{background:var(--viola);color:#fff}
.lineup{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.lg-head{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--muted);background:var(--surface-2);padding:7px 14px}
.lu{display:grid;grid-template-columns:minmax(150px,1.1fr) auto minmax(180px,1.4fr);gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.lg-head + .lu{border-top:0}
.lu.out .lu-name{opacity:.55}
.lu-name{display:flex;gap:10px;align-items:center;min-width:0}
.lu-name b{overflow-wrap:anywhere}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--bg);padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"][data-v="titolare"]{background:var(--ok);color:var(--on-sem)}
.seg button[aria-pressed="true"][data-v="panchina"]{background:var(--warn);color:var(--on-sem)}
.seg button[aria-pressed="true"][data-v=""]{background:var(--surface-2);color:var(--ink)}
.lu-goal{width:100%}
tr.sub td{background:var(--surface-2);font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:12.5px;color:var(--muted);padding:6px 10px}
td.goalcell{white-space:normal;min-width:160px;font-size:13.5px}
@media (max-width:760px){.lu{grid-template-columns:1fr}.seg{justify-self:start}}
@media (max-width:480px){.steps{grid-template-columns:1fr}}

/* campo */
.field-wrap{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:16px;align-items:start}
.pitch{position:relative;width:100%;aspect-ratio:3/4;background:var(--band);border-radius:var(--r);overflow:hidden;
  background-image:repeating-linear-gradient(180deg,transparent 0 12.5%,rgba(255,255,255,.035) 12.5% 25%)}
.pitch-lines{position:absolute;inset:0;width:100%;height:100%}
.pitch-lines *{fill:none;stroke:var(--band-muted);stroke-opacity:.45;stroke-width:.5;vector-effect:non-scaling-stroke}
.tok{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;width:84px}
.disc{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--acido);color:var(--acido-ink);font-family:var(--f-display);font-weight:800;font-size:19px;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.disc.gk{background:var(--band-ink);color:var(--band)}
.tok .nm{font-size:12px;font-weight:700;color:var(--band-ink);text-transform:uppercase;letter-spacing:.03em;max-width:84px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.empty-slot .disc{background:transparent;border:2px dashed var(--band-muted);color:var(--band-muted)}
.empty-slot .nm{color:var(--band-muted);font-weight:500}
.disc .arm{position:absolute;top:-6px;right:-10px}
.arm{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 4px;border-radius:5px;background:var(--viola);color:#fff;font-family:var(--f-display);font-weight:800;font-size:12px;line-height:1;border:1.5px solid var(--acido)}
.arm.vc{background:var(--surface-2);color:var(--ink);border-color:var(--viola);font-size:10.5px}
.pitch-mod{position:absolute;left:10px;top:8px;font-family:var(--f-display);font-weight:800;font-size:15px;color:var(--acido);letter-spacing:.06em}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.posti{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.capt{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.match .link{color:var(--viola);font-weight:700}
@media (max-width:760px){.field-wrap{grid-template-columns:1fr}.pitch{max-width:420px;margin:0 auto}}
@media (max-width:420px){.tok{width:70px}.tok .nm{max-width:70px;font-size:11px}.disc{width:34px;height:34px;font-size:16px}.capt{grid-template-columns:1fr}}

/* accesso */
.login{max-width:380px;margin:24px auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px 20px;display:flex;flex-direction:column;gap:14px;align-items:stretch}
.login .big-crest{width:auto;height:110px;align-self:center}
.login h2{text-align:center}.login p{margin:0;text-align:center}
.lg-err{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:8px 12px;font-weight:600;font-size:14px}
.btn-out{background:none;border:1px solid var(--band-muted);color:var(--band-ink);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:600;cursor:pointer}
.btn-out:hover{border-color:var(--acido)}
.sumrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.sumrow>div{display:flex;flex-direction:column;gap:2px}
.sumrow .v{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1}
.sumrow .v.bad{color:var(--bad)}
.sumrow .k{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
td.wrapcell{white-space:normal;min-width:220px}
.row.nowrap{flex-wrap:nowrap}
.paystat{display:flex;flex-direction:column;gap:4px;border-radius:var(--r);padding:16px 18px;border:1px solid var(--line)}
.paystat .v{font-family:var(--f-display);font-weight:800;font-size:28px;text-transform:uppercase;line-height:1}
.paystat.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.paystat.due{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}

/* barra pubblicazione */
.pubbar{padding-inline:16px}
.pub-in{max-width:1080px;margin:0 auto;padding-block:10px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-weight:600;font-size:14px}
.pubbar.ok{background:var(--ok-soft);color:var(--ok)}
.pubbar.due{background:var(--warn-soft);color:var(--warn)}

/* tattiche */
.tlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.tname{font-size:16px}
.tsteps{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--viola);border-color:var(--viola);color:#fff}
.tarrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tarrows .ar{stroke:var(--acido);stroke-width:2.2;stroke-dasharray:6 4;fill:none}
.tarrows .ar-ball{stroke:#fff;stroke-width:1.6;stroke-dasharray:3 3;fill:none}
.tarrows .ah{fill:var(--acido)} .tarrows .ahb{fill:#fff}
.tpitch .tok{z-index:2}
.tpitch.edit{cursor:crosshair}
.tpitch.edit .ttok,.tpitch.edit .ball{cursor:pointer}
.ttok.sel .disc,.ball.sel .bdisc{outline:3px solid #fff;outline-offset:2px}
.ttok.me .disc{box-shadow:0 0 0 3px var(--band),0 0 0 6px var(--acido)}
.ball{width:auto;z-index:3}
.bdisc{display:block;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid #1a1a1a;box-shadow:0 1px 2px rgba(0,0,0,.5)}
@media (prefers-reduced-motion:no-preference){.tpitch .tok{transition:left 1s ease-in-out,top 1s ease-in-out}}

/* top player */
.toptbl td{padding:11px 12px}
.toptbl .pos{width:64px;font-family:var(--f-display);font-weight:800;font-size:18px;color:var(--muted)}
.toptbl .val{font-family:var(--f-display);font-weight:800;font-size:22px}
.toptbl tr.first td{background:var(--band);color:var(--band-ink)}
.toptbl tr.first .pos,.toptbl tr.first .val{color:var(--acido)}
.toptbl tr.me:not(.first) td{background:var(--viola-soft)}

/* riusa tattiche */
.reuse{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.reuse-row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.reuse-row:first-child{border-top:0}
.reuse-txt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.reuse-box summary{cursor:pointer;font-weight:700;color:var(--viola);padding:4px 0}
.reuse-box[open] summary{margin-bottom:10px}

.tacpanel{border-color:var(--viola)}

/* quote */
.month-nav{display:flex;align-items:center;gap:8px}
.month-nav .lbl{font-family:var(--f-display);font-weight:800;font-size:22px;text-transform:uppercase;min-width:170px;text-align:center}
.paybar{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.paybar i{display:block;height:100%;background:var(--ok)}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 12px 4px 4px;font-weight:600;font-size:13px}
.toggle .k{width:22px;height:22px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line)}
.toggle.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.toggle.on .k{background:var(--ok);border-color:var(--ok)}
.toggle.off{color:var(--bad)}

.help{background:var(--viola-soft);border-radius:var(--r);padding:14px 16px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.help b{color:var(--viola)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bad-soft);color:var(--bad);padding:10px 12px;border-radius:8px;font-weight:600}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;z-index:9;max-width:calc(100% - 32px)}
@media (max-width:560px){
  .hero{grid-template-columns:1fr;text-align:left}
  .hero .big{text-align:left;font-size:56px}
  .brand .who{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:no-preference){.btn,.toggle,.match{transition:border-color .15s,background .15s}}
.campo-sw{position:relative;display:inline-block}
.campo-menu{position:absolute;z-index:30;top:100%;left:0;margin-top:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:200px;box-shadow:0 6px 20px rgba(0,0,0,.15)}
.campo-menu button{text-align:left;padding:8px 10px;border-radius:8px;border:0;background:transparent;color:var(--ink);font-weight:600;cursor:pointer}
.campo-menu button[aria-current="true"]{background:var(--surface-2)}
/* migliorie: grafici, cassa, classifica, grafica Instagram */
:root{--gf:#6a3fb5;--gs:#d9730d}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--gf:#9b70ff;--gs:#d0752a}}
:root[data-theme="dark"]{--gf:#9b70ff;--gs:#d0752a}
.chart-wrap{overflow-x:auto}
.chart{display:block;max-width:100%;height:auto}
.chart .axis{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart text.lbl{fill:var(--ink);font-weight:600}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:6px;font-size:13px;font-weight:600;max-width:250px}
.form-strip{display:flex;gap:6px;flex-wrap:wrap}
.form-strip span{width:32px;height:32px;border-radius:7px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:17px}
.fv{background:var(--ok-soft);color:var(--ok)}.fn{background:var(--warn-soft);color:var(--warn)}.fp{background:var(--bad-soft);color:var(--bad)}
.igwrap{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;align-items:start}
.igwrap img{width:100%;border-radius:var(--r);border:1px solid var(--line);background:var(--band);aspect-ratio:4/5;object-fit:contain}
@media (max-width:640px){.igwrap{grid-template-columns:1fr}}
tr.noi td{background:var(--viola-soft)}
.cl-tbl td input[type=text]{min-width:130px}
textarea{font:inherit;color:inherit}
textarea.riep{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;line-height:1.5}
a.btn{text-decoration:none;color:inherit;display:inline-block}
.next-big{font-size:19px;margin-top:4px}
.al-row{display:grid;grid-template-columns:minmax(150px,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.al-row:first-child{border-top:0}
.al-seg button[aria-pressed="true"][data-v="p"]{background:var(--ok);color:var(--on-sem)}
.al-seg button[aria-pressed="true"][data-v="a"]{background:var(--bad);color:var(--on-sem)}
.al-seg button[aria-pressed="true"][data-v="g"]{background:var(--surface-2);color:var(--ink)}
.al-bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}.al-bar i{display:block;height:100%}
.sg-list{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.sg-list li{line-height:1.3}
.ig-cap{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
@media (max-width:560px){.al-row{grid-template-columns:1fr}.al-seg{justify-self:start}}
.tl-card{text-align:left;cursor:pointer;font:inherit;color:inherit;width:100%}.tl-card:hover{border-color:var(--viola)}
.tl-steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.tok[hidden]{display:none!important}
.campo-sw .btn{background:transparent;color:var(--band-ink);border-color:var(--band-muted)}
.campo-sw .btn:hover{border-color:var(--acido)}

:root[data-campo="a5"]{--viola:#1b7a3a;--viola-soft:#e2f2e6;--acido:#d4a72c;--acido-ink:#1a1405;--band:#0d3b1e;--band-ink:#f2f7ee;--band-muted:#a9c9a6;--bg:#f3f7f2;--surface:#ffffff;--surface-2:#eaf2ea;--line:#d6e4d7;--gf:#1f7a44;--gs:#7c4dbd}
@media (prefers-color-scheme: dark){:root[data-campo="a5"]:not([data-theme="light"]){--viola:#2f9a52;--viola-soft:#173a22;--acido:#e3b23c;--acido-ink:#140f05;--band:#07240f;--band-ink:#f2f7ee;--band-muted:#93b893;--bg:#0b140d;--surface:#132017;--surface-2:#1a2b1f;--line:#26402c;--gf:#3fae62;--gs:#9b70ff}}
:root[data-campo="a5"][data-theme="dark"]{--viola:#2f9a52;--viola-soft:#173a22;--acido:#e3b23c;--acido-ink:#140f05;--band:#07240f;--band-ink:#f2f7ee;--band-muted:#93b893;--bg:#0b140d;--surface:#132017;--surface-2:#1a2b1f;--line:#26402c;--gf:#3fae62;--gs:#9b70ff}
/* ULTIMATE TEAM: carte stile FUT */
.ut-wrap{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:18px;align-items:start}
.ut-left,.ut-right{display:flex;flex-direction:column;gap:10px;min-width:0}
.ut-pitch{position:relative;background:var(--band);border-radius:var(--r);padding:14px 8px;display:flex;flex-direction:column;gap:12px;justify-content:space-around;min-height:460px;overflow:hidden;background-image:repeating-linear-gradient(180deg,transparent 0 12.5%,rgba(255,255,255,.035) 12.5% 25%)}
.ut-pitch .pitch-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ut-row{position:relative;display:flex;justify-content:center;gap:8px}
.ut-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px}
.utc{--c1:#dfe3e8;--c2:#9aa4ae;--ink:#16181b;--acc:#16181b;position:relative;border:0;cursor:pointer;font:inherit;color:var(--ink);background:linear-gradient(155deg,var(--c1),var(--c2));border-radius:14px 14px 22px 22px;padding:10px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 2px 0 rgba(0,0,0,.25),inset 0 0 0 2px rgba(255,255,255,.35);text-align:center;min-width:0;width:100%;max-width:170px;justify-self:center}
.utc:hover{transform:translateY(-2px)}
.utc.t-bro{--c1:#e2a676;--c2:#8c5430;--ink:#2a1608}
.utc.t-arg{--c1:#eef1f4;--c2:#9aa4ae;--ink:#1a1d21}
.utc.t-oro{--c1:#f6e39a;--c2:#c09634;--ink:#2b2008}
.utc.t-spec{--c1:#2b1a52;--c2:#0f0820;--ink:#fff;--acc:#c4ff1f;box-shadow:0 2px 0 rgba(0,0,0,.35),inset 0 0 0 2px #c4ff1f}
.utc.t-motm{--c1:var(--viola);--c2:var(--band);--ink:#fff;--acc:var(--acido);box-shadow:0 2px 0 rgba(0,0,0,.35),inset 0 0 0 2px var(--acido)}
.utc.t-empty{background:transparent;border:2px dashed var(--band-muted);color:var(--band-muted);box-shadow:none;cursor:default;min-height:96px;justify-content:center}
.utc-top{position:absolute;left:9px;top:8px;display:flex;flex-direction:column;align-items:center;line-height:1}
.utc-ovr{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:.9;color:var(--acc)}
.utc-pos{font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.06em}
.utc-num{font-family:var(--f-display);font-weight:700;font-size:12px;opacity:.75;margin-top:2px}
.utc-face{width:86px;height:104px;object-fit:cover;border-radius:10px 10px 4px 4px;margin:4px 0 0 26px;background:rgba(0,0,0,.12)}
.ut-noface{display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:34px;color:var(--ink);opacity:.8;background:rgba(255,255,255,.25)}
.utc-nm{font-family:var(--f-display);font-weight:800;font-size:17px;text-transform:uppercase;letter-spacing:.03em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-top:1px solid currentColor;border-color:rgba(0,0,0,.18);padding-top:3px;width:100%}
.utc-st{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 6px;width:100%;font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.04em}
.utc-st span{display:flex;gap:3px;justify-content:center;align-items:baseline}
.utc-st b{font-size:15px;font-weight:800}
.utc-up{position:absolute;right:8px;top:8px;font-family:var(--f-display);font-weight:800;font-size:12px;background:#17824a;color:#fff;border-radius:5px;padding:1px 5px}
.utc-badge{font-family:var(--f-display);font-weight:800;font-size:11px;letter-spacing:.08em;background:var(--acido);color:var(--acido-ink);border-radius:4px;padding:1px 6px}
.utc.mini{width:78px;max-width:22%;min-width:62px;padding:6px 4px 6px;gap:2px;border-radius:10px 10px 16px 16px}
.utc.mini .utc-ovr{position:absolute;left:5px;top:4px;font-size:20px}
.utc.mini .utc-pos{position:absolute;left:6px;top:24px;font-size:10px}

.utc.mini .ut-noface{font-size:20px}
.utc.mini .utc-nm{font-size:11.5px;padding-top:2px}
.utc.big{max-width:220px;padding:14px 12px}
.utc.big .utc-ovr{font-size:46px}
.utc.big .utc-face{width:120px;height:150px;margin-left:34px}
.utc.big .utc-nm{font-size:22px}
.utc.big .utc-st{font-size:13px}.utc.big .utc-st b{font-size:18px}
.ut-legend ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.ut-detail .ut-dtop{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start}
.ut-dinfo{display:flex;flex-direction:column;gap:10px;min-width:0}
.ut-hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ut-hist li{position:relative;border:1px solid var(--line);border-radius:var(--r);padding:10px 56px 10px 12px;display:flex;flex-direction:column;gap:6px}
.ut-ovrh{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-family:var(--f-display);font-weight:800;font-size:26px;color:var(--viola)}
.ut-bon{display:flex;flex-wrap:wrap;gap:6px}
.ut-b{font-size:13px;font-weight:700;background:var(--ok-soft);color:var(--ok);border-radius:6px;padding:2px 8px}
.ut-b i{font-style:normal;font-weight:500;opacity:.85}
.ut-b.star{background:var(--acido);color:var(--acido-ink)}
.ut-motm{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ut-md{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--viola)}
.ut-vs{font-weight:600;font-size:17px}.ut-sc{font-family:var(--f-display);font-weight:800}
.ut-mbody{display:grid;grid-template-columns:176px 1fr;gap:14px;align-items:center}
.ut-minfo{display:flex;flex-direction:column;gap:6px;min-width:0}
.ut-vf{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.ut-vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
@media (max-width:760px){.ut-wrap{grid-template-columns:1fr}.ut-detail .ut-dtop{grid-template-columns:1fr}.ut-detail .utc.big{justify-self:center}}
@media (max-width:420px){.ut-grid{grid-template-columns:repeat(2,1fr)}.ut-pitch{min-height:400px;padding:12px 4px}.ut-row{gap:5px}}
.seg button[aria-pressed="true"][data-utsub]{background:var(--viola);color:#fff}
@media (max-width:560px){.ut-mbody{grid-template-columns:1fr}.ut-mbody .utc{max-width:180px}.ut-minfo{align-items:center;text-align:center}}
.ut-vlist{display:flex;flex-direction:column;gap:8px}
.ut-vrow{display:grid;grid-template-columns:minmax(120px,1fr) repeat(3,minmax(90px,120px));gap:10px;align-items:end;border-top:1px solid var(--line);padding-top:8px}
.ut-vrow b{align-self:center;overflow-wrap:anywhere}
.ut-base summary{cursor:pointer;font-weight:700;color:var(--viola);padding:4px 0}
@media (max-width:560px){.ut-vrow{grid-template-columns:repeat(2,1fr)}.ut-vrow b{grid-column:1/-1}}
.utc.t-prime{--c1:#1a1a1a;--c2:#4a3a10;--ink:#f7e7a6;--acc:#f2c94c;box-shadow:0 2px 0 rgba(0,0,0,.4),inset 0 0 0 2px #f2c94c}
.utc.t-prime .utc-badge{background:#f2c94c;color:#1a1405}
.ut-moms{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.ut-mom{gap:10px}
.ut-gimg{width:100%;border-radius:8px;display:block;cursor:zoom-in;background:var(--surface-2)}
.ut-prime{display:flex;justify-content:center;padding:8px 0}
.ut-zoom{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
.ut-zoom img{max-width:100%;max-height:calc(100vh - 90px);border-radius:8px}
.div-tbl td input[type=text]{min-width:130px}.div-tbl select{width:auto;padding:5px 8px;font-size:14px}.div-tbl input[type=checkbox]{width:20px;height:20px}
.div-list{display:flex;flex-direction:column}
.div-row{display:grid;grid-template-columns:minmax(160px,1.3fr) minmax(130px,1fr) 90px 100px 100px auto;gap:10px;align-items:end;padding:10px 4px;border-top:1px solid var(--line)}
.div-row:first-child{border-top:0}.div-row.on{background:var(--viola-soft);border-radius:8px}
.div-who{display:flex;gap:8px;align-items:center;align-self:center;min-width:0}.div-who b{overflow-wrap:anywhere}
.div-chk{display:flex;gap:6px;align-items:center;font-weight:700;padding-bottom:8px;cursor:pointer}.div-chk input{width:20px;height:20px}
@media (max-width:640px){.div-row{grid-template-columns:1fr 1fr 1fr}.div-chk{grid-column:1/-1}.div-who,.div-row>label.f:first-of-type{grid-column:1/-1}}
.div-who input[type=text]{flex:1}
/* schede su più righe: tutte visibili senza scorrere */
.tabs{flex-wrap:wrap;overflow-x:visible;gap:2px;padding-bottom:6px}
.tabs button{padding:7px 10px 8px;font-size:15px;letter-spacing:.04em}
@media (max-width:560px){.tabs button{padding:6px 8px 7px;font-size:14px}}
.ut-cardcol{display:flex;flex-direction:column;align-items:center;gap:10px}
.ut-spark{display:flex;flex-direction:column;gap:2px}.ut-spark .k{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.ut-mine{flex-direction:row;align-items:center;gap:14px;text-align:left;cursor:pointer;font:inherit;color:inherit;border-color:var(--viola)}
.ut-mine-l .utc.mini{max-width:none;width:84px}.ut-mine-r{display:flex;flex-direction:column;gap:4px;min-width:0}
.ut-mine-r .ut-spark svg{width:180px;height:40px}
.ut-subs{display:flex;flex-wrap:wrap;gap:6px}
.tm-next{border-color:var(--viola);gap:6px}.tm-vs{font-family:var(--f-display);font-weight:800;font-size:30px;text-transform:uppercase;line-height:1}.tm-when{font-size:16px;font-weight:600}
.tm-next .btn{align-self:flex-start;margin-top:6px}
.tm-list{display:flex;flex-direction:column;gap:8px}
.tm-item{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;font-weight:700;font-size:16px;cursor:pointer;background:var(--surface)}
.tm-item input{width:24px;height:24px;accent-color:var(--ok)}.tm-item.on{border-color:var(--ok);background:var(--ok-soft)}
.tm-admin.warn{border-color:var(--bad)}
a.btn.go{color:var(--acido-ink);text-align:center}
.utc-med{position:absolute;right:8px;top:30px;font-size:12px;font-weight:800;font-family:var(--f-display);background:rgba(0,0,0,.18);border-radius:5px;padding:0 4px}
.utc.mini .utc-med{display:none}
.ut-badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.ut-badge{display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:center;border:1.5px dashed var(--line);border-radius:10px;padding:8px 10px;opacity:.75}
.ut-badge .ico{font-size:22px;grid-row:span 2}.ut-badge b{font-size:14px}
.ut-badge.on{border-style:solid;border-color:var(--acido);background:var(--viola-soft);opacity:1}
.ut-badge .btn{grid-row:span 2}
.ut-prog{grid-column:2/4;height:5px;border-radius:9px;background:var(--surface-2);overflow:hidden}.ut-prog i{display:block;height:100%;background:var(--viola)}
.ut-vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.ut-vsc{display:flex;flex-direction:column;gap:8px;align-items:center;min-width:0}.ut-vsc .utc{max-width:160px}.ut-vsc label{width:100%;max-width:200px}
.ut-vsx{font-family:var(--f-display);font-weight:800;font-size:30px;color:var(--viola)}
.ut-vst th{text-align:center;background:none;border-bottom:1px solid var(--line)}.ut-vst td{width:40%;font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--muted)}
.ut-vst td.win{color:var(--ok)}
.ut-premi{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}.ut-premio{gap:8px;padding:12px}
.ut-pw{display:flex;gap:10px;align-items:center}.ut-pw .utc.mini{width:70px;max-width:none}
@media (max-width:420px){.ut-vs{grid-template-columns:1fr 1fr}.ut-vsx{display:none}}

function totals(pid){
  const t={pres:0,min:0,gol:0,ass:0,gialli:0,rossi:0,mvp:0,voti:[],ob:0,obOk:0};
  for(const m of S.matches){
    const s=(m.stats||{})[pid]; if(m.mvp===pid)t.mvp++;
    if(!s)continue;
    const min=num(s.minuti); if(min>0)t.pres++;
    t.min+=min;t.gol+=num(s.gol);t.ass+=num(s.assist);t.gialli+=num(s.gialli);t.rossi+=num(s.rossi);
    if(num(s.voto)>0)t.voti.push(num(s.voto));
    if(s.obiettivo){t.ob++;if(s.raggiunto)t.obOk++}
  }
  t.media=t.voti.length?(t.voti.reduce((a,b)=>a+b,0)/t.voti.length):null;
  return t;
}

const QUOTA_MESE=25,QUOTA_GK=5;
const APP_URL=location.origin+location.pathname.replace(/[^/]*$/,"");
const te=new TextEncoder();
const hex=b=>[...b].map(x=>x.toString(16).padStart(2,"0")).join("");
const b64=b=>{let s="";for(let i=0;i<b.length;i+=8192)s+=String.fromCharCode(...b.subarray(i,i+8192));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const keyCache={};
function deriveCreds(login,pw){
  const id=String(login).trim().toLowerCase()+"\u0000"+pw;
  return keyCache[id]||(keyCache[id]=(async()=>{
    const base=await crypto.subtle.importKey("raw",te.encode(id),"PBKDF2",false,["deriveBits"]);
    const bits=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:te.encode("gemina-fc-spogliatoio-v1"),iterations:150000,hash:"SHA-256"},base,512));
    return {lookup:hex(bits.slice(0,32)),keyRaw:bits.slice(32)};
  })());
}
const aesKey=raw=>crypto.subtle.importKey("raw",raw,"AES-GCM",false,["encrypt","decrypt"]);
async function seal(raw,obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},await aesKey(raw),te.encode(JSON.stringify(obj)));return {iv:b64(iv),ct:b64(new Uint8Array(ct))}}
async function unseal(raw,d){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(d.iv)},await aesKey(raw),unb64(d.ct));return JSON.parse(new TextDecoder().decode(pt))}

const b64url=b=>b64(b).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const unb64url=s=>unb64(s.replace(/-/g,"+").replace(/_/g,"/")+"===".slice((s.length+3)%4));
const unhex=h=>Uint8Array.from(h.match(/../g),x=>parseInt(x,16));
/* link personale: #g + chiave del giocatore, apre la sua scheda senza digitare nulla */
async function openFromLink(){
  const h=(location.hash||"").slice(1);
  if(!/^g[A-Za-z0-9_-]{80,90}$/.test(h))return false;
  try{const raw=unb64url(h.slice(1));if(raw.length!==64)return false;
    const lookup=hex(raw.slice(0,32)),key=raw.slice(32);
    if(await openPlayer(lookup,key)){setSess({t:"player",lookup,key:b64(key)});return true}
  }catch(e){}
  return false;
}
S.links={};
function personalLink(pid){
  const c=S.cred[pid];if(!c||!c.login||!c.password)return Promise.resolve(null);
  return deriveCreds(c.login,c.password).then(r=>{const raw=new Uint8Array(64);raw.set(unhex(r.lookup),0);raw.set(r.keyRaw,32);return S.links[pid]=APP_URL+"#g"+b64url(raw)});
}

function utSpark(c){
  const series=c.hist.map(h=>h.ovr);
  if(series.length<2)return "";
  const W=220,H=48,mn=Math.min(...series),mx=Math.max(...series),rg=Math.max(1,mx-mn);
  const xy=series.map((v,i)=>[4+i*(W-8)/(series.length-1),H-6-(v-mn)*(H-14)/rg]);
  const d=xy.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ");
  const [lx,ly]=xy[xy.length-1];
  return `<div class="ut-spark"><span class="k">Andamento carta</span><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Valutazione da ${series[0]} a ${series[series.length-1]}"><path d="${d}" fill="none" stroke="var(--viola)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${lx}" cy="${ly}" r="3.5" fill="var(--viola)"/></svg><span class="small muted">${series[0]} → <b>${series[series.length-1]}</b></span></div>`;
}

const UT_COL={bro:["#e2a676","#8c5430","#2a1608","#2a1608"],arg:["#eef1f4","#9aa4ae","#1a1d21","#1a1d21"],oro:["#f6e39a","#c09634","#2b2008","#2b2008"],spec:["#2b1a52","#0f0820","#ffffff","#c4ff1f"],motm:[null,null,"#ffffff",null],prime:["#1a1a1a","#4a3a10","#f7e7a6","#f2c94c"]};

function utRR(x,c,X,Y,W,H,r1,r2){x.beginPath();x.moveTo(X+r1,Y);x.lineTo(X+W-r1,Y);x.quadraticCurveTo(X+W,Y,X+W,Y+r1);x.lineTo(X+W,Y+H-r2);x.quadraticCurveTo(X+W,Y+H,X+W-r2,Y+H);x.lineTo(X+r2,Y+H);x.quadraticCurveTo(X,Y+H,X,Y+H-r2);x.lineTo(X,Y+r1);x.quadraticCurveTo(X,Y,X+r1,Y);x.closePath()}
function utCanvasBase(){
  const css=getComputedStyle(document.documentElement),v=n=>css.getPropertyValue(n).trim();
  return {v,band:v("--band")||"#24104a",viola:v("--viola")||"#4a1d8c",acido:v("--acido")||"#b4f000",bink:v("--band-ink")||"#fff",F:(w,s)=>`${w} ${s}px "Saira Condensed","Arial Narrow",Arial,sans-serif`};
}

/* carta 560x800 con angolo in alto a sinistra in (CX,CY) */
async function utDrawCardAt(x,T,p,kind,CX,CY,lab){

function utBadgeStats(p,c){
  const t=totals(p.id),cs=c.hist.filter(h=>h.b.some(x=>x[2]==="porta inviolata")).length,rg=c.hist.reduce((a,h)=>a+h.b.filter(x=>/rigor/.test(x[2])).reduce((q,x)=>q+x[1]/2,0),0);
  return {gol:t.gol,ass:t.ass,pres:c.hist.length,motm:c.motm,spo:c.spo,al:c.nAl,cs,rg};
}
const UT_BADGES=[
  ["gol",[1,5,10,20],n=>n===1?"Primo gol":`${n} gol`,"⚽",p=>!utIsGK(p)],
  ["ass",[1,5,10,20],n=>n===1?"Primo assist":`${n} assist`,"🅰️",p=>!utIsGK(p)],
  ["cs",[1,3,5,10],n=>n===1?"Prima porta inviolata":`${n} porte inviolate`,"🧤",p=>utIsGK(p)||p.ruolo==="Difensore"],
  ["rg",[1,3],n=>n===1?"Primo rigore parato":`${n} rigori parati`,"🛡️",p=>utIsGK(p)],
  ["pres",[10,20,30],n=>`${n} presenze`,"👕",()=>true],
  ["motm",[1,3,5,10],n=>n===1?"Primo Man of the Match":`${n} volte Man of the Match`,"⭐",()=>true],
  ["spo",[1,3,5],n=>n===1?"Primo premio spogliatoio":`${n} premi spogliatoio`,"💜",()=>true],
  ["al",[10,20,40],n=>`${n} allenamenti`,"🏃",()=>true]
];
function utBadges(p,c){
  c=c||utCard(p);const st=utBadgeStats(p,c),out=[];
  for(const[k,lv,name,ico,ok] of UT_BADGES){if(!ok(p))continue;const n=st[k]||0;
    const got=lv.filter(x=>n>=x),next=lv.find(x=>n<x);
    if(got.length)out.push({ok:true,ico,name:name(got[got.length-1]),n});
    if(next!=null)out.push({ok:false,ico,name:name(next),n,need:next});}
  return out;
}

  const b=utBadges(p,c),ok=b.filter(x=>x.ok),todo=b.filter(x=>!x.ok);

function quoteDueList(k){
  const pag=((S.quote[k]||{}).pagati)||{},out=[];
  for(const p of S.players){
    let n=0;const parts=[];
    if(quotaMese(p)>0&&!(pag[p.id]||{}).pagato){n+=quotaMese(p);parts.push(`quota ${monthLabel(k)}`)}
    if(quotaPart(p)>0){const o=gkMatches(p.id,k).filter(m=>dovutaMatch(p.id,m)&&!gkEntry(p.id,m.id,k).pagato).length*quotaPart(p);if(o){n+=o;parts.push("partite del mese")}}
    const d=debtParts(p.id,k);if(d.mesi+d.partite){n+=d.mesi+d.partite;parts.push("arretrati")}if(d.tess){n+=d.tess;parts.push("tesseramento")}
    if(n)out.push({p,n,parts});

  for(const p of S.staff){if(tessDue(p)&&!tessPaid(p))out.push({p,n:tessDue(p),parts:["tesseramento"]})}

S.utMese=null;
function utMonths(){return [...new Set(S.matches.filter(m=>isPlayed(m)&&m.data).map(m=>m.data.slice(0,7)))].sort()}
function utMeseData(k){
  const ms=S.matches.filter(m=>isPlayed(m)&&m.data&&m.data.slice(0,7)===k).sort((a,b)=>a.data.localeCompare(b.data));
  const r={v:0,n:0,p:0,gf:0,gs:0},gol={},ass={},motm=[];
  for(const m of ms){const f=num(m.gf),g=num(m.gs);r.gf+=f;r.gs+=g;f>g?r.v++:f<g?r.p++:r.n++;
    for(const[pid,st] of Object.entries(m.stats||{})){const p=playerById(pid);if(!p||isColl(p))continue;if(num(st.gol))gol[pid]=(gol[pid]||0)+num(st.gol);if(num(st.assist))ass[pid]=(ass[pid]||0)+num(st.assist)}
    const w=utMotm(m);if(w&&playerById(w))motm.push({m,p:playerById(w)});}
  const top=o=>Object.entries(o).map(([pid,n])=>({p:playerById(pid),n})).sort((a,b)=>b.n-a.n);
  return {ms,r,gol:top(gol),ass:top(ass),motm};
}
const utRes=m=>num(m.gf)>num(m.gs)?["V","s-ok"]:num(m.gf)<num(m.gs)?["S","s-bad"]:["N","s-warn"];

  <div class="panel"><div class="sumrow"><div><span class="v num">${d.ms.length}</span><span class="k">Partite</span></div><div><span class="v num">${d.r.v}-${d.r.n}-${d.r.p}</span><span class="k">Vinte · pari · perse</span></div><div><span class="v num">${d.r.gf}:${d.r.gs}</span><span class="k">Gol fatti e subiti</span></div></div></div>

async function utDrawMese(k){

  y+=h2+26;

  if(nM>0){box(80+nM*50);x.fillStyle=acido;x.font=F(800,38);x.fillText("MAN OF THE MATCH",90,y+52);
    d.motm.slice(0,nM).forEach((e,i)=>{const yy=y+108+i*50;x.fillStyle=bink;x.font=F(700,38);x.fillText(nm(e.p),90,yy,480);x.textAlign="right";x.globalAlpha=.75;x.font=F(700,32);x.fillText(("vs "+e.m.avversario).toUpperCase(),W-90,yy,400);x.globalAlpha=1;x.textAlign="left"})}

  const up=ev.filter(e=>e.data>=todayISO()),past=ev.filter(e=>e.data<todayISO()).reverse();
  h+=up.length?up.map(eventCard).join(""):`<div class="muted">Nessun evento in programma.</div>`;
  if(past.length)h+=`<h3>Già passati</h3>`+past.map(eventCard).join("");
  return h;
}

function linesOf(mod){const l=String(mod||"").split("-").map(Number);return l.length>=2&&l.every(n=>n>0)&&l.reduce((a,b)=>a+b,0)===maxTit()-1?l:(S.campo==="a5"?[2,2]:[3,3,1])}
function lineName(i,n){return i===0?"Difesa":i===n-1?"Attacco":n>3&&i===n-2?"Trequarti":"Centrocampo"}
function slotsOf(mod){
  const L=linesOf(mod),out=[{k:"0",label:"Portiere",x:50,y:88}];let k=1;
  L.forEach((n,i)=>{const y=70-(i*(52/Math.max(1,L.length-1)));for(let j=0;j<n;j++)out.push({k:String(k++),label:lineName(i,L.length)+(n>1?" "+(j+1):""),x:(j+1)*100/(n+1),y})});
  return out;
}
const ROLE_ORDER={Portiere:0,Difensore:1,Centrocampista:2,Attaccante:3};
function resolvePosti(m){
  const slots=slotsOf(m.modulo),tit=S.players.filter(p=>lineupOf(m,p.id)==="titolare");
  const res={},used=new Set();
  for(const sl of slots){const pid=(m.posti||{})[sl.k];if(pid&&!used.has(pid)&&tit.some(p=>p.id===pid)){res[sl.k]=pid;used.add(pid)}}
  const rest=tit.filter(p=>!used.has(p.id)).sort((a,b)=>(ROLE_ORDER[a.ruolo]??4)-(ROLE_ORDER[b.ruolo]??4)||num(a.numero)-num(b.numero));
  const want=sl=>sl.k==="0"?"Portiere":sl.label.startsWith("Difesa")?"Difensore":sl.label.startsWith("Attacco")?"Attaccante":"Centrocampista";
  for(const sl of slots){if(!res[sl.k]){const p=rest.find(x=>x.ruolo===want(sl));if(p){rest.splice(rest.indexOf(p),1);res[sl.k]=p.id}}}
  for(const sl of slots){if(!res[sl.k]&&rest.length){const p=sl.k==="0"?rest[0]:(rest.find(x=>x.ruolo!=="Portiere")||rest[0]);rest.splice(rest.indexOf(p),1);res[sl.k]=p.id}}
  return res;
}

  body.vice=d.vice&&stats[d.vice]&&d.vice!==body.capitano?d.vice:null;

/* ---------- TATTICHE ---------- */
const FASI=["In possesso","Non possesso","Palla inattiva"];
const PITCH_LINES=`<svg class="pitch-lines" viewBox="0 0 100 133" preserveAspectRatio="none" aria-hidden="true"><rect x="3" y="3" width="94" height="127" rx="1.5"/><line x1="3" y1="66.5" x2="97" y2="66.5"/><circle cx="50" cy="66.5" r="11"/><rect x="24" y="3" width="52" height="19"/><rect x="24" y="111" width="52" height="19"/><rect x="38" y="125" width="24" height="5"/><rect x="38" y="3" width="24" height="5"/></svg>`;
function tacPlayers(m){return Object.values(resolvePosti(m)).filter(pid=>playerById(pid))}
function startPos(m,pid){const sl=slotOfPlayer(m,pid);return sl?{x:sl.x,y:sl.y}:null}
function posAt(m,t,pid,k){let p=pid==="ball"?null:startPos(m,pid);for(let i=0;i<k&&i<t.steps.length;i++){const q=((t.steps[i]||{}).pos||{})[pid];if(q)p=q}return p}
function hasBall(t){return t.steps.some(s=>(s.pos||{}).ball)}
function arrowsSvg(m,t,k){
  let l="";
  if(k>=1)for(const pid of [...tacPlayers(m),"ball"]){
    const a=posAt(m,t,pid,k-1),b=posAt(m,t,pid,k);
    if(!b||!((t.steps[k-1]||{}).pos||{})[pid])continue;
    const s=a||b,x1=s.x*3,y1=s.y*4,x2=b.x*3,y2=b.y*4,dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy);if(L<6)continue;
    const sh=pid==="ball"?8:18,ex=x2-dx/L*sh,ey=y2-dy/L*sh;
    l+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" class="${pid==="ball"?"ar-ball":"ar"}" marker-end="url(#${pid==="ball"?"ahb":"ah"})"/>`;
  }
  return `<svg class="tarrows" viewBox="0 0 300 400" aria-hidden="true"><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0L10,5L0,10z" class="ah"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0L10,5L0,10z" class="ahb"/></marker></defs>${l}</svg>`;
}
function tacPitch(m,t,k,o){
  o=o||{};
  let h=`<div class="pitch tpitch${o.edit?" edit":""}" role="img" aria-label="Tattica ${esc(t.nome||"")}, ${k?"movimento "+k:"posizione di partenza"}">${PITCH_LINES}${arrowsSvg(m,t,k)}`;
  for(const pid of tacPlayers(m)){const p=playerById(pid),q=posAt(m,t,pid,k);if(!q)continue;
    h+=`<div class="tok ttok${o.sel===pid?" sel":""}${o.me===pid?" me":""}" data-p="${pid}"${o.edit?` data-tok="${pid}"`:""} style="left:${q.x}%;top:${q.y}%"><span class="disc${p.ruolo==="Portiere"?" gk":""}">${esc(p.numero||"–")}</span><span class="nm">${o.me===pid?"TU":esc(cognome(p.nome))}</span></div>`}
  if(hasBall(t)||o.edit){const q=posAt(m,t,"ball",k);

/* raccolta tattiche: ogni tattica salvata resta disponibile per le giornate successive */
S.lib={};
const newTid=()=>"t"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
function toSlots(m,t){
  const inv={};for(const[k,pid] of Object.entries(resolvePosti(m)))inv[pid]=k;
  return {nome:t.nome,fase:t.fase,note:t.note||"",modulo:effMod(m),
    steps:(t.steps||[]).map(st=>{const pos={};for(const[pid,q] of Object.entries(st.pos||{})){if(pid==="ball")pos.ball=q;else if(inv[pid]!=null)pos["s"+inv[pid]]=q}return {pos,txt:st.txt||""}})};
}
function fromSlots(lt,target){
  const tp=resolvePosti(target);
  return (lt.steps||[]).map(st=>{const pos={};for(const[k,q] of Object.entries(st.pos||{})){if(k==="ball")pos.ball=q;else{const pid=tp[k.slice(1)];if(pid)pos[pid]=q}}return {pos,txt:st.txt||""}});
}
function libItems(){
  const out={};
  for(const lt of Object.values(S.lib))out[lt.id]={key:lt.id,lt};
  for(const m of S.matches)for(const t of (m.tattiche||[])){const k=t.libId||t.id;if(!out[k])out[k]={key:k,lt:{id:k,...toSlots(m,t),da:`${m.numero||"–"}ª vs ${m.avversario||"?"}`}}}
  return Object.values(out).sort((a,b)=>String(a.lt.nome).localeCompare(b.lt.nome));
}
function makeFromLib(key,target){const it=libItems().find(x=>x.key===key);if(!it)return null;const lt=it.lt;return {id:newTid(),libId:key,nome:lt.nome,fase:lt.fase,note:lt.note||"",steps:fromSlots(lt,target)}}
const MAX_TAC=6; /* tattiche al massimo in una partita */
const effMod=x=>linesOf(x&&x.modulo).join("-");
function tacBlock(lt,target){
  const cur=target.tattiche||[];
  if(cur.some(t=>(t.libId||t.id)===lt.id||String(t.nome||"").trim().toLowerCase()===String(lt.nome||"").trim().toLowerCase()))return "Questa tattica è già nella giornata.";
  if(effMod(lt)!==effMod(target))return `Questa tattica è per il ${effMod(lt)}, la giornata si gioca con il ${effMod(target)}: i movimenti finirebbero ai giocatori sbagliati.`;
  if(cur.length>=MAX_TAC)return `Massimo ${MAX_TAC} tattiche per partita: togline una per aggiungerne un'altra.`;

}
const libModOf=t=>{const l=S.lib[t.libId||t.id];return l&&l.modulo?l.modulo:""};
const fasePill=f=>`<span class="pill ${f==="Non possesso"?"s-bad":f==="Palla inattiva"?"s-warn":"s-ok"}">${esc(f)}</span>`;
function reusePicker(target,where){

/* ---------- TOP PLAYER ---------- */
function cleanSheets(pid){
  let cs=0,pl=0,gs=0;
  for(const m of S.matches){
    if(!isPlayed(m))continue;
    const s=(m.stats||{})[pid]||{};
    const played=num(s.minuti)>0||(s.minuti==null||s.minuti==="")&&lineupOf(m,pid)==="titolare";
    if(!played)continue;
    pl++;gs+=num(m.gs);if(num(m.gs)===0)cs++;
  }
  return {cs,pl,gs};
}
function ranked(rows){
  rows=rows.filter(r=>r.v>0).sort((a,b)=>b.v-a.v||(a.t??0)-(b.t??0)||String(a.p.nome).localeCompare(b.p.nome));
  rows.forEach((r,i)=>{const pr=rows[i-1];r.rank=pr&&pr.v===r.v&&(pr.t??0)===(r.t??0)?pr.rank:i+1});
  return rows;
}
function rankedAsc(rows){
  rows=rows.sort((a,b)=>a.v-b.v||b.t-a.t||String(a.p.nome).localeCompare(b.p.nome));
  rows.forEach((r,i)=>{const pr=rows[i-1];r.rank=pr&&pr.v===r.v&&pr.t===r.t?pr.rank:i+1});
  return rows;
}

  out.qm=quotaMese(p);out.qp=quotaPart(p);

    if(qm)h+=`<div class="muted small">La tua quota: <b>€ ${qm} al mese + € ${qp} a partita</b>.</div><h3>Partite · € ${qp} a partita</h3>`;
    else if(ts)h+=`<h3>Partite · € ${qp} a partita</h3>`;
    h+=`<div class="paystat ${open.length?"due":"ok"}"><span class="v num">${open.length?"€ "+open.length*qp:"Tutto pagato"}</span><span>${open.length?`da pagare per ${open.length} ${open.length===1?"partita":"partite"} (€ ${qp} a partita)`:"Sei in regola con le partite"}</span></div>`;
    if(!ms.length)h+=`<div class="empty"><span>Non ci sono ancora partite in cui sei stato convocato.</span></div>`;
    else h+=`<div class="tbl"><table><thead><tr><th>Partita</th><th>Data</th><th class="n">Quota</th><th>Stato</th></tr></thead><tbody>${ms.map(m=>`<tr><td><b>${esc(m.numero||"–")}ª</b> vs ${esc(m.avversario||"?")}</td><td class="muted">${fmtDate(m.data)}</td><td class="n">€ ${qp}</td><td>${!pm(m).d?`<span class="pill s-mute">Non dovuta</span>`:pm(m).p?`<span class="pill s-ok">Pagata</span>`:`<span class="pill s-bad">Da pagare</span>`}</td></tr>`).join("")}</tbody></table></div>`;
    if(!qm)return h;
    h+=`<h3>Quota mensile · € ${qm} al mese</h3>`;
  }
  const lastPaid=Object.keys(pay.mesi).sort().pop()||cur;
  const months=monthsRange(seasonStart(Object.keys(pay.mesi)),lastPaid>cur?lastPaid:cur).reverse();
  const thisPaid=!!pay.mesi[cur],openM=months.filter(k=>k<=cur&&!pay.mesi[k]);
  let upto=null;if(thisPaid){upto=cur;while(pay.mesi[shiftMonth(upto,1)])upto=shiftMonth(upto,1)}
  h+=`<div class="paystat ${thisPaid?"ok":"due"}"><span class="v num">${monthLabel(cur)}</span><span>${thisPaid?`Quota pagata${(pay.mesi[cur]||{}).a?" in anticipo":(pay.mesi[cur]||{}).d?" il "+fmtDate(pay.mesi[cur].d):""}${upto&&upto>cur?` · sei coperto fino a ${monthLabel(upto)}`:""}`:`Quota di € ${qm} non ancora pagata`}</span></div>`;
  if(openM.length&&!(openM.length===1&&!thisPaid))h+=`<div class="muted small">Totale da pagare: <b>€ ${openM.length*qm}</b></div>`;
  h+=`<div class="tbl"><table><thead><tr><th>Mese</th><th class="n">Quota</th><th>Stato</th></tr></thead><tbody>${months.map(k=>`<tr><td><b>${monthLabel(k)}</b></td><td class="n">€ ${qm}</td><td>${pay.mesi[k]?`<span class="pill s-ok">${(pay.mesi[k]||{}).a?"Anticipata":k>cur?"Pagata in anticipo":"Pagata"}</span>`:`<span class="pill s-bad">Da pagare</span>`}</td></tr>`).join("")}</tbody></table></div>`;
  return h;
}

const addDays=(iso,n)=>{const[y,m,d]=iso.split("-").map(Number);const x=new Date(y,m-1,d+n);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const titleCase=s=>String(s||"").toLowerCase().replace(/(^|[\s'’-])(\p{L})/gu,(a,b,c)=>b+c.toUpperCase());
function fmtLong(iso){if(!iso)return"";const[y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"})}
const fmtEur=v=>{const n=Math.round(num(v)*100)/100;return Number.isInteger(n)?String(n):n.toFixed(2).replace(".",",")};
function nextMatch(){const t=today();return S.matches.filter(m=>!isPlayed(m)&&m.data&&m.data>=t).sort((a,b)=>String(a.data).localeCompare(String(b.data))||num(a.numero)-num(b.numero))[0]||null}
function lastPlayed(){return S.matches.filter(isPlayed).sort((a,b)=>String(b.data).localeCompare(String(a.data))||num(b.numero)-num(a.numero))[0]||null}

/* ---------- RIEPILOGO PER IL GRUPPO WHATSAPP ---------- */
const waLink=t=>"https://wa.me/?text="+encodeURIComponent(t);
function riepilogoText(){
  const o=S.riepOpt,nome=CAMPI[S.campo].nome.toUpperCase(),t=today(),L=[`⚽ *${nome}* · aggiornamento`];
  if(o.partita){
    const m=nextMatch();
    if(m){
      L.push("",`📅 *Prossima partita*${m.numero?" · "+m.numero+"ª giornata":""}`,`${nome} – ${String(m.avversario||"?").toUpperCase()}`,`${fmtLong(m.data)}${m.orario?" · ore "+m.orario:""} · ${m.casa==="trasferta"?"in trasferta":"in casa"}${m.luogo?" · "+m.luogo:""}`);
      if(m.obiettivoSquadra)L.push(`🎯 Obiettivo: ${m.obiettivoSquadra}`);
      const tit=S.players.filter(p=>lineupOf(m,p.id)==="titolare"),pan=S.players.filter(p=>lineupOf(m,p.id)==="panchina");
      if(tit.length){L.push(`✅ Titolari: ${tit.map(p=>titleCase(p.nome)).join(", ")}`);if(pan.length)L.push(`🔄 Panchina: ${pan.map(p=>titleCase(p.nome)).join(", ")}`)}
      else L.push("📋 Formazione in arrivo");
    }else{const lp=lastPlayed();if(lp)L.push("",`🏁 Ultima partita: ${nome} ${num(lp.gf)}–${num(lp.gs)} ${String(lp.avversario||"").toUpperCase()}`)}
  }
  if(o.eventi){
    const lim=addDays(t,14),ev=(S.events||[]).filter(e=>!e.per&&e.data&&e.data>=t&&e.data<=lim).sort((a,b)=>a.data.localeCompare(b.data));
    const al=(S.allen||[]).filter(a=>a.data&&a.data>=t&&a.data<=addDays(t,7)).sort((a,b)=>a.data.localeCompare(b.data)||String(a.ora||"").localeCompare(String(b.ora||"")));
    if(al.length){L.push("","🏃 *Allenamenti*");for(const a of al)L.push(`• ${fmtLong(a.data)}${a.ora?" ore "+a.ora:""}${a.luogo?" – "+a.luogo:""}`)}
    if(ev.length){L.push("","📌 *Prossimi appuntamenti*");for(const e of ev)L.push(`• ${fmtDate(e.data)}${e.ora?" ore "+e.ora:""} – ${e.titolo}${e.scadenza&&e.scadenza!==e.data?" (entro il "+fmtDate(e.scadenza)+")":""}${e.costo?" · € "+fmtEur(e.costo):""}`)}
  }
  if(o.quote){
    const cur=monthKey(new Date()),deb=S.players.map(p=>({p,v:debtBefore(p.id,shiftMonth(cur,1))})).filter(x=>x.v>0);
    if(deb.length){L.push("",`💶 *Quote da pagare* (fino a ${monthLabel(cur)})`);for(const x of deb)L.push(`• ${titleCase(x.p.nome)}: € ${x.v}`)}
    const mu=S.players.map(p=>({p,v:multeAperte(p.id)})).filter(x=>x.v>0);
    if(mu.length){L.push("","⚠️ *Multe da pagare*");for(const x of mu)L.push(`• ${titleCase(x.p.nome)}: € ${fmtEur(x.v)}`)}
  }
  if(o.visite){
    const vis=S.players.filter(p=>!(S.visite[p.id]||{}).fatta);
    if(vis.length&&visScad()>=t)L.push("",`🩺 *Visita medica* da fare entro ${fmtLong(visScad())}: ${vis.map(p=>titleCase(p.nome)).join(", ")}`);
  }
  L.push("",`Forza ${CAMPI[S.campo].corto}! ${CAMPI[S.campo].cuori}`);
  return L.join("\n");
}

const CAT_USC=["Campo","Arbitro","Iscrizione","Divise e materiale","Visite mediche","Altro"],CAT_ENT=["Sponsor","Contributo","Altro"];
function quoteMonthTot(q){let v=0,mesi=0,partite=0;for(const r of Object.values(q.pagati||{}))if(r&&r.pagato){v+=feeMese();mesi++}for(const g of Object.values(q.portieri||{}))for(const e of Object.values(g||{}))if(e&&e.pagato){v+=feePart();partite++}return {v,mesi,partite}}
function cassaQuote(){let mesi=0,partite=0,tot=0,tess=0;for(const q of Object.values(S.quote)){const r=quoteMonthTot(q);mesi+=r.mesi;partite+=r.partite;tot+=r.v}if(isC5())for(const p of S.players)if(tessPaid(p)){tess++;tot+=QUOTA_C5_TESS}return {mesi,partite,tot,tess}}
function viewCassa(){
  const q=cassaQuote(),mov=[...(S.cassa||[])].sort((a,b)=>String(b.data).localeCompare(String(a.data)));
  const ent=mov.filter(m=>m.tipo==="entrata").reduce((s,m)=>s+num(m.importo),0),usc=mov.filter(m=>m.tipo!=="entrata").reduce((s,m)=>s+num(m.importo),0),mul=(S.multe||[]).filter(f=>f.pagata).reduce((s,f)=>s+num(f.importo),0),saldo=q.tot+ent+mul-usc;

  h+=`<div class="panel"><div class="sumrow">
      <div><span class="v num">€ ${fmtEur(q.tot)}</span><span class="k">Quote incassate</span></div>
      <div><span class="v num">€ ${fmtEur(mul)}</span><span class="k">Multe incassate</span></div>
      <div><span class="v num">€ ${fmtEur(ent)}</span><span class="k">Altre entrate</span></div>
      <div><span class="v num">€ ${fmtEur(usc)}</span><span class="k">Spese</span></div>
      <div><span class="v num${saldo<0?" bad":""}">€ ${fmtEur(saldo)}</span><span class="k">In cassa</span></div>
    </div><div class="muted small">${isC5()?`${q.tess} ${q.tess===1?"tesseramento":"tesseramenti"} da € ${QUOTA_C5_TESS} e ${q.partite} ${q.partite===1?"quota":"quote"} a partita da € ${feePart()}`:`${q.mesi} ${q.mesi===1?"quota mensile":"quote mensili"} da € ${feeMese()} e ${q.partite} ${q.partite===1?"quota":"quote"} a partita da € ${feePart()}`}</div></div>`;
  h+=`<form class="panel" id="addMov"><h3>Nuovo movimento</h3><div class="grid-form">
      <label class="f">Tipo<select id="mv-tipo"><option value="uscita" ${tipo==="uscita"?"selected":""}>Spesa</option><option value="entrata" ${tipo==="entrata"?"selected":""}>Entrata</option></select></label>
      <label class="f">Categoria<select id="mv-cat">${cats.map(c=>`<option>${c}</option>`).join("")}</select></label>
      <label class="f">Importo (€)<input type="number" id="mv-imp" min="0" step="0.5" required placeholder="Es. 60"></label>
      <label class="f">Data<input type="date" id="mv-data" value="${today()}" required></label>
      <label class="f" style="grid-column:1/-1">Descrizione<input type="text" id="mv-desc" placeholder="${tipo==="entrata"?"Es. Sponsor maglie":"Es. Affitto campo 7ª giornata"}"></label>
      <button class="btn primary" type="submit">Aggiungi ${tipo==="entrata"?"entrata":"spesa"}</button></div></form>`;
  const months={},add=(k,f,v)=>{if(!k)return;months[k]=months[k]||{q:0,e:0,u:0};months[k][f]+=v};
  for(const[k,qq] of Object.entries(S.quote))add(k,"q",quoteMonthTot(qq).v);
  if(isC5())for(const p of S.players)if(tessPaid(p))add(String(p.tess.data||today()).slice(0,7),"q",QUOTA_C5_TESS);

  }
  return h+`</tbody></table></div>`;
}

function seasonRecord(){
  const ms=S.matches.filter(isPlayed).sort((a,b)=>String(a.data).localeCompare(String(b.data))||num(a.numero)-num(b.numero));
  const r={g:ms.length,v:0,n:0,p:0,gf:0,gs:0,cs:0,ms};
  for(const m of ms){const f=num(m.gf),s=num(m.gs);r.gf+=f;r.gs+=s;if(f>s)r.v++;else if(f<s)r.p++;else r.n++;if(s===0)r.cs++}
  r.pt=r.v*3+r.n;return r;
}
const shortName=s=>{const w=String(s||"?").trim().split(/\s+/)[0]||"?";return w.length>9?w.slice(0,8)+"…":w};
function roundTop(x,y,w,h){const r=Math.min(4,h,w/2);return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`}
function goalsChart(ms){
  const W=Math.max(340,ms.length*64+40),H=230,pt=16,pb=40,pl=30,pr=10,ih=H-pt-pb;
  const max=Math.max(1,...ms.map(m=>Math.max(num(m.gf),num(m.gs)))),step=max<=6?1:max<=12?2:5,top=Math.ceil(max/step)*step;
  const y=v=>pt+ih-(v/top)*ih,gw=(W-pl-pr)/ms.length,bw=Math.min(18,gw*0.3);
  let g="";
  for(let v=0;v<=top;v+=step)g+=`<line class="axis" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"${v?' stroke-dasharray="2 4"':""}/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  ms.forEach((m,i)=>{
    const cx=pl+gw*i+gw/2,f=num(m.gf),s=num(m.gs),res=f>s?"vittoria":f<s?"sconfitta":"pareggio";
    const bar=(x,v,c)=>v>0?`<path d="${roundTop(x,y(v),bw,y(0)-y(v))}" fill="var(${c})"/>`:"";
    g+=`<g data-tip="${esc(`${m.numero||"–"}ª vs ${m.avversario||"?"} · ${f}–${s} (${res}) · ${f} fatti, ${s} subiti`)}"><rect x="${cx-gw/2}" y="${pt}" width="${gw}" height="${ih+pb}" fill="transparent"/>${bar(cx-bw-1,f,"--gf")}${bar(cx+1,s,"--gs")}<text x="${cx}" y="${H-pb+16}" text-anchor="middle" class="lbl">${esc(String(m.numero||"–"))}ª</text><text x="${cx}" y="${H-pb+31}" text-anchor="middle">${esc(shortName(m.avversario))}</text></g>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="Gol fatti e subiti per giornata">${g}</svg>`;
}

  const txt=(t,y,s,w,f,col,o={})=>{if(LS)x.letterSpacing=(o.ls||0)+"px";fitF(t,o.max||W-160,s,w,f);x.fillStyle=col;x.textAlign="center";x.textBaseline="alphabetic";x.fillText(t,W/2,y);if(LS)x.letterSpacing="0px"};

  const pill=(t,y,s,bg,fg)=>{if(LS)x.letterSpacing="4px";fitF(t,W-260,s,800,DF);const w=x.measureText(t).width+s*1.6,h=s*1.5;x.fillStyle=bg;rr(W/2-w/2,y-h/2,w,h,h/2);x.fill();x.fillStyle=fg;x.textAlign="center";x.textBaseline="middle";x.fillText(t,W/2,y+s*0.06);x.textBaseline="alphabetic";if(LS)x.letterSpacing="0px"};

async function downloadBackup(btn){
  if(!S.dl){toast("Da qui non posso scaricare file. Entra come dirigenza.");return}
  btn.disabled=true;
  try{await S.dl.save({filename:`${CAMPI[S.campo].file}-copia-${today()}.xlsx`,data:xlsxBlob(backupSheets())});toast("Copia di sicurezza scaricata")}

}

function gcalLink(o){
  let dates;
  if(o.time){const[h,mi]=o.time.split(":").map(Number),[y,mo,d]=o.date.split("-").map(Number),st=new Date(y,mo-1,d,h,mi),en=new Date(st.getTime()+(o.dur||60)*60000);
    const f=t=>t.getFullYear()+String(t.getMonth()+1).padStart(2,"0")+String(t.getDate()).padStart(2,"0")+"T"+String(t.getHours()).padStart(2,"0")+String(t.getMinutes()).padStart(2,"0")+"00";dates=f(st)+"/"+f(en)}
  else dates=o.date.replace(/-/g,"")+"/"+addDays(o.date,1).replace(/-/g,"");
  const p=new URLSearchParams({action:"TEMPLATE",text:o.title,dates,ctz:"Europe/Rome"});if(o.details)p.set("details",o.details);if(o.location)p.set("location",o.location);
  return "https://calendar.google.com/calendar/render?"+p.toString();
}

/* ---------- PRECEDENTI CONTRO L'AVVERSARIO ---------- */
const normOpp=s=>String(s||"").trim().toLowerCase().replace(/\s+/g," ");
function storicoFrom(arch){const out=[];for(const a of arch||[])for(const m of a.giornate||[])if(m.gf!==""&&m.gf!=null)out.push({stagione:a.nome||a.id,avversario:m.avversario||"",data:m.data||"",numero:m.numero||"",gf:num(m.gf),gs:num(m.gs)});return out}
function precedenti(m){
  const n=normOpp(m.avversario);if(!n)return [];
  const cur=S.matches.filter(x=>x.id!==m.id&&isPlayed(x)&&normOpp(x.avversario)===n).map(x=>({stagione:"Questa stagione",data:x.data,numero:x.numero,gf:num(x.gf),gs:num(x.gs)}));
  const old=(S.mode==="player"?S.storico:storicoFrom(S.archivio)).filter(x=>normOpp(x.avversario)===n);
  return [...cur,...old].sort((a,b)=>String(b.data).localeCompare(String(a.data)));
}
function precPanel(m){
  const L=precedenti(m);if(!L.length)return "";
  const v=L.filter(x=>x.gf>x.gs).length,p=L.filter(x=>x.gf<x.gs).length,n=L.length-v-p,gf=L.reduce((s,x)=>s+x.gf,0),gs=L.reduce((s,x)=>s+x.gs,0);
  return `<div class="panel"><div class="spread"><h3>Precedenti contro ${esc(m.avversario)}</h3><span class="muted small">${L.length} ${L.length===1?"partita":"partite"} · ${v} V · ${n} N · ${p} P · gol ${gf}–${gs}</span></div>
    <div class="tbl"><table><tbody>${L.map(x=>`<tr><td class="muted">${esc(x.stagione)}</td><td>${x.numero?esc(x.numero)+"ª · ":""}${fmtDateY(x.data)}</td><td class="n"><b class="num">${x.gf}–${x.gs}</b></td><td>${x.gf>x.gs?'<span class="pill s-ok">Vittoria</span>':x.gf<x.gs?'<span class="pill s-bad">Sconfitta</span>':'<span class="pill s-warn">Pareggio</span>'}</td></tr>`).join("")}</tbody></table></div></div>`;
}

/* ---------- GIOCATORE DEL MESE: media voto più alta nel mese (almeno 2 partite con voto se il mese ne ha 2 o più) ---------- */
function potm(){
  const by={};
  for(const m of S.matches){if(!isPlayed(m))continue;const k=matchMonth(m);if(!k)continue;const B=by[k]=by[k]||{n:0,pl:{}};B.n++;
    for(const[pid,s] of Object.entries(m.stats||{})){if(!S.players.some(p=>p.id===pid))continue;const o=B.pl[pid]=B.pl[pid]||{v:[],gol:0,ass:0,pres:0,mvp:0},v=num(s.voto);if(num(s.minuti)>0||v>0)o.pres++;if(v>0)o.v.push(v);o.gol+=num(s.gol);o.ass+=num(s.assist)}
    if(m.mvp&&B.pl[m.mvp])B.pl[m.mvp].mvp++}
  const cur=monthKey(new Date());
  return Object.keys(by).sort().reverse().map(k=>{const B=by[k],minP=B.n>=2?2:1;
    const c=Object.entries(B.pl).filter(([,o])=>o.v.length>=minP).map(([pid,o])=>({p:playerById(pid),media:o.v.reduce((a,b)=>a+b,0)/o.v.length,gol:o.gol,ass:o.ass,pres:o.pres,mvp:o.mvp})).filter(x=>x.p)
      .sort((a,b)=>b.media-a.media||(b.gol+b.ass)-(a.gol+a.ass)||b.mvp-a.mvp||String(a.p.nome).localeCompare(String(b.p.nome)));
    return {k,n:B.n,best:c[0]||null,inCorso:k===cur}}).filter(x=>x.best);
}
function potmPanel(){
  const L=potm();if(!L.length)return "";
  return `<div class="panel"><div class="spread"><div><h3>Giocatore del mese</h3><div class="muted small">Chi ha la media voto più alta nel mese (con almeno 2 partite votate, se nel mese se ne sono giocate 2 o più). A parità contano gol + assist.</div></div>${S.admin?`<button class="btn sm${S.igPotm?" go":""}" data-igpotm>${S.igPotm?"Chiudi grafica":"Grafica Instagram"}</button>`:""}</div>${S.admin&&S.igPotm?igPotmPanel(L):""}
